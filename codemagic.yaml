# Codemagic — iOS 앱(Capacitor) 빌드·TestFlight 업로드.
# 준비물(코드매직 화면에서, 값은 저장소에 쓰지 않는다):
#  1) Teams → Integrations → App Store Connect에 API 키(Issuer ID·Key ID·.p8)를 등록하고, 그 이름을 아래 integrations.app_store_connect에 쓴다.
#  2) Environment variables 그룹 'triptic_app'(앱 번들 안에 들어가는 값): VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_GOOGLE_MAPS_API_KEY,
#     VITE_POSTHOG_KEY, VITE_POSTHOG_HOST, VITE_SENTRY_DSN (.env.local의 같은 이름)
#  3) 아래 APP_STORE_APPLE_ID — App Store Connect에서 앱을 만들면 나오는 숫자 Apple ID(앱 정보 → 일반 정보)
# 서명(인증서·프로비저닝 프로파일)은 코드매직이 App Store Connect API로 자동 만든다(ios_signing).
workflows:
  ios-testflight:
    name: Triptic iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Triptic App Store Connect   # ← 코드매직 Integrations에 등록한 이름으로 바꾼다
    environment:
      groups:
        - triptic_app
      vars:
        BUNDLE_ID: com.triptic.travel
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "0000000000"   # ← 앱을 만든 뒤 숫자 Apple ID로 바꾼다(빌드 번호를 TestFlight 마지막 번호 + 1로 올리는 데 쓴다)
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.triptic.travel
    scripts:
      - name: 패키지 설치
        script: npm ci
      - name: 웹 앱 빌드 + iOS 프로젝트에 반영
        script: |
          npm run build
          npx cap sync ios
      - name: 서명 설정 적용
        script: xcode-project use-profiles
      - name: 빌드 번호 올리기(TestFlight 마지막 번호 + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios/App
          agvtool new-version -all $((LATEST + 1))
      - name: IPA 만들기
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 심사 제출은 App Store Connect에서 직접(스크린샷·설명·심사 메모를 채운 뒤)
