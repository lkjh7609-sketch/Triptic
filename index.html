            const client = await getSupabaseAuthClient();
            if (!client) return;

            if (confirm('로그아웃 하시겠습니까?')) {
                await client.auth.signOut();
                lockApp();
                if (typeof showToast === 'function') {
                    showToast('로그아웃되었습니다.');
                }
            }
        }

        async function initAuthProtection() {
            const client = await getSupabaseAuthClient();
            if (!client) {
                setTimeout(initAuthProtection, 100);
                return;
            }

            try {
                const { data: { session } } = await client.auth.getSession();
                if (session && session.user) {
                    unlockApp(session.user);
                } else {
                    lockApp();
                }
            } catch (e) {
                console.warn('세션 확인 중 오류:', e);
                lockApp();
            }

            client.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session?.user) {
                    unlockApp(session.user);
                    if (window.location.hash.includes('access_token=') || window.location.search.includes('code=')) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                    if (typeof showToast === 'function') {
                        const name = session.user.user_metadata?.full_name || '여행자';
                        showToast(`반가워요, ${name}님! 🎉`);
                    }
                } else if (event === 'SIGNED_OUT') {
                    lockApp();
                }
            });
        }

        if (!hasExistingAuthHint) {
            lockApp();
        }

        function formatRelativeTime(timestamp) {
            if (!timestamp) return '방금 전';
            const diff = Date.now() - Number(timestamp);
            if (isNaN(diff) || diff < 0) return '방금 전';
            
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return '방금 전';
            if (mins < 60) return `${mins}분 전`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}시간 전`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}일 전`;
            
            const d = new Date(timestamp);
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        }

                }

                if (!data || typeof data !== 'object' || Array.isArray(data) || data.error) {
                    showToast('해당 코드로 저장된 백업 데이터를 찾을 수 없습니다.', { type: 'error' });
                    return;
                }

                const validProjects = {};
                Object.keys(data).forEach(k => {
                    if (k === 'error') return;
                    const p = data[k];
                    if (p && typeof p === 'object' && !Array.isArray(p) && (p.city || p.startDate || p.data)) {
                        validProjects[k] = p;
                    }
                });

                if (Object.keys(validProjects).length === 0) {
                    showToast('해당 코드에 등록된 유효한 여행 일정이 없습니다.', { type: 'error' });
                    return;
                }

                allProjects = { ...allProjects, ...validProjects };
                saveAllProjects();
                renderLobby();
                closeModal();
                showToast('🎉 성공적으로 여행 데이터를 병합했습니다!');
            } catch (e) {
                showToast('데이터를 가져오는 중 오류가 발생했습니다.', { type: 'error' });
            }
        }

        async function initSystem() {
            const params = new URLSearchParams(location.search);
            const shareId = params.get('id');
            const shareParam = params.get('share');

            if (shareId) {
                try {
                    const res = await fetch(`${FIREBASE_DB_URL}/shares/${shareId}.json`);
                    const payload = await res.json();
                    if (!payload) throw new Error('Not found');
                    currentSharedId = shareId;
                    openSharedView(payload);
                    hideSplash();
                    return;
                } catch (e) {
                    showToast('공유 링크가 만료되었거나 찾을 수 없습니다.', { type: 'error' });
                }
            } else if (shareParam) {
                try {
                    const json = LZString.decompressFromEncodedURIComponent(shareParam);
                    const payload = JSON.parse(json);
                    openSharedView(payload);
                    hideSplash();
                    return;
                } catch (e) {
                    showToast('공유 링크 데이터가 올바르지 않습니다.', { type: 'error' });
                }
            }

            // Clean up any legacy corrupted "error" project from localStorage
            let needsSave = false;
            if (allProjects['error'] !== undefined) {
                delete allProjects['error'];
                needsSave = true;
            }
            Object.keys(allProjects).forEach(k => {
                const p = allProjects[k];
                if (!p || typeof p !== 'object' || Array.isArray(p) || (!p.city && !p.startDate && !p.data)) {
                    delete allProjects[k];
                    needsSave = true;
                }
            });
            if (needsSave) saveAllProjects(false);

            ensureBackupId();
            renderLobby();
            restoreFromCloudBackupIfNeeded();
            hideSplash();
        }

        function hideSplash() {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) splash.classList.add('hidden');
            }, 500);
        }

        function renderLobby() {
            toggleMobileView('list');
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            activeProjectName = null;

            const container = document.getElementById('project-list-container');
            container.innerHTML = '';

            const sortedNames = Object.keys(allProjects).filter(name => {
                const p = allProjects[name];
                return name !== 'error' && p && typeof p === 'object' && !Array.isArray(p) && (p.city || p.startDate || p.data);
            }).sort((a, b) => {
                const timeA = allProjects[a].updatedAt || 0;
                const timeB = allProjects[b].updatedAt || 0;
                return timeB - timeA;
            });

            if (sortedNames.length === 0) {
                container.className = 'project-list empty-state-container';
                container.innerHTML = `
                    <div class="lobby-empty-notice">
                        <div class="empty-icon">여행</div>
                        <div class="empty-title">저장된 여행 일정이 없습니다</div>
                        <div class="empty-desc">위의 <b>[＋ 새 여행 만들기]</b>를 눌러 첫 여행을 기록해 보세요!</div>
                    </div>
                `;
                return;
            }

            container.className = 'project-list';

            sortedNames.forEach(name => {
                const p = allProjects[name];
                const card = document.createElement('div');
                card.className = 'project-card';
                
                let totalPlaces = 0;
                if (p.data) {
                    Object.values(p.data).forEach(arr => {
                        if (Array.isArray(arr)) totalPlaces += arr.length;
                    });
                }

                let daysText = '';
                if (p.startDate && p.endDate) {
                    const s = new Date(p.startDate);
                    const e = new Date(p.endDate);
                    const diffTime = e - s;
                    if (!isNaN(diffTime) && diffTime >= 0) {
                        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
                        const nights = diffDays - 1;
                        daysText = nights > 0 ? `${nights}박 ${diffDays}일` : '당일치기';
                    }
                }

                const cityText = p.city ? escapeHtml(p.city) : '여행지 미정';
                const timeStr = formatRelativeTime(p.updatedAt);
                const safeName = escapeHtml(name);

                card.innerHTML = `
                    <div class="project-card-header">
                        <div class="project-card-badge">
                            <span>📍</span>
                            <span>${cityText}</span>
                        </div>
                        <div class="project-card-actions">
                            <button type="button" class="clone-project-btn" title="여행 복제">복제</button>
                            <button type="button" class="delete-project-btn" title="여행 삭제">삭제</button>
                        </div>
                    </div>
                    <div class="project-card-main">
                        <h3 class="project-card-title">${safeName}</h3>
                        <div class="project-card-dates">
                            <span>🗓️</span>
                            <span>${escapeHtml(p.startDate)} ~ ${escapeHtml(p.endDate)}</span>
                            ${daysText ? `<span class="project-duration-tag">${daysText}</span>` : ''}
                        </div>
                    </div>
                    <div class="project-card-footer">
                        <div class="project-card-meta">
                            <span class="project-places-badge">장소 ${totalPlaces}곳</span>
                            <span class="project-updated-time">최근 수정: ${timeStr}</span>
                        </div>
                        <span class="project-open-link">일정 보기 →</span>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    openProject(name);
                });

                card.querySelector('.clone-project-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    cloneProject(name);
                });

                card.querySelector('.delete-project-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteProject(name);
                });

                container.appendChild(card);
            });
        }

        function deleteProject(name) {
            const safeName = escapeHtml(name);
            openModal(`
                <h3>🗑️ 여행 삭제</h3>
                <p style="font-size:14px; color:var(--text-body); line-height:1.6;">
                    <b>'${safeName}'</b> 여행을 정말 삭제하시겠습니까?<br>

                </p>
                <div class="modal-actions">
                    <button type="button" class="modal-btn secondary" onclick="closeModal()">취소</button>
                    <button type="button" class="modal-btn danger" id="confirm-delete-btn">삭제하기</button>
                </div>
            `);

            document.getElementById('confirm-delete-btn').onclick = async () => {
                const shareId = allProjects[name] ? allProjects[name].shareId : null;
                delete allProjects[name];
                saveAllProjects();
                renderLobby();
                closeModal();
                showToast(`'${safeName}' 여행이 삭제되었습니다.`);

                if (shareId && FIREBASE_DB_URL) {

                }

        function cloneProject(name) {
            const original = allProjects[name];
            if (!original) return;

            let newName = `${name} (복사본)`;
            let counter = 1;
            while (allProjects[newName]) {
                counter++;
                newName = `${name} (복사본 ${counter})`;
            }

            const clone = JSON.parse(JSON.stringify(original));
            clone.shareId = null;
            clone.updatedAt = Date.now();

            allProjects[newName] = clone;
            saveAllProjects();
            renderLobby();
            showToast(`'${escapeHtml(newName)}'으로 복제되었습니다!`);
        }

        function saveAllProjects(silent = false) {
            try {
                const serialized = JSON.stringify(allProjects);
                const sizeInMB = new Blob([serialized]).size / (1024 * 1024);

                // 4.5MB 이상이면 경고 (5MB 제한에 근접)
                if (sizeInMB > 4.5) {
                    console.warn(`localStorage 용량 경고: ${sizeInMB.toFixed(2)}MB / 5MB`);
                    showToast('저장 공간이 거의 가득 찼습니다. 백업 후 오래된 여행을 삭제하세요.', {
                        type: 'warning',
                        duration: 5000
                    });
                }

                localStorage.setItem('smartPlannerAllProjects', serialized);
                if (!silent) scheduleBackupSync();
                return true;
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    console.error('localStorage 용량 초과:', e);
                    showToast('저장 공간이 가득 찼습니다. 백업 후 일부 여행을 삭제해 주세요.', {
                        type: 'error',
                        duration: 6000
                    });
                } else {
                    console.error('저장 오류:', e);
                    showToast('데이터 저장 중 오류가 발생했습니다.', {
                        type: 'error',
                        duration: 5000
                    });
                }
                return false;
            }
        }

        function saveData() {
            if (!activeProjectName || !allProjects[activeProjectName]) return;

            if (plannerData[currentDay]) {
                plannerData[currentDay] = plannerData[currentDay].filter(item => item && item.lat != null && item.lng != null);
            }

            const p = allProjects[activeProjectName];
            p.data = plannerData;
            p.hotels = hotelsData;
            p.meals = mealsData;
            p.expenses = expensesData;
            p.flights = flightsData;
            p.currency = tripCurrency;
            p.currentDay = currentDay;
            p.city = tripCity;
            p.cityLat = tripCityLat;
            p.cityLng = tripCityLng;
            p.startDate = tripStart;
            p.endDate = tripEnd;
            p.shareId = activeShareId;
            p.updatedAt = Date.now();

            saveAllProjects();
            scheduleShareSync();
        }

        function exportAllData() {
            try {
                const str = JSON.stringify(allProjects, null, 2);
                const blob = new Blob([str], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const today = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `Triptic_백업_${today}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('백업 파일이 다운로드되었습니다.');
            } catch (e) {
                showToast('데이터 내보내기 중 오류가 발생했습니다.', { type: 'error' });
            }
        }

        function importAllData(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported || typeof imported !== 'object') throw new Error('Invalid format');

                    const count = Object.keys(imported).length;
                    allProjects = { ...allProjects, ...imported };
                    saveAllProjects();
                    renderLobby();
                    closeModal();
                    showToast(`🎉 ${count}개의 여행을 불러왔습니다!`);
                } catch (err) {
                    showToast('올바른 백업 JSON 파일이 아닙니다.', { type: 'error' });
                }
            };
            reader.readAsText(file);
        }

        async function submitCreateProject() {
            const name = document.getElementById('new-name-input').value.trim();
            const startVal = document.getElementById('new-start-input').value;
            const endVal = document.getElementById('new-end-input').value;
            const currVal = document.getElementById('new-currency-select').value;
            const obCode = document.getElementById('new-outbound-flight-input').value.trim();

            if (!pendingCity) { showToast('목적지 도시를 검색하여 선택해 주세요.', { type: 'error' }); return; }
            if (!startVal || !endVal) { showToast('여행 기간을 입력해 주세요.', { type: 'error' }); return; }

            if (rtCode && !pendingFlights.return) pendingFlights.return = await lookupFlight(rtCode, endVal);

                cityLat: pendingCity.lat,
                cityLng: pendingCity.lng,

                meals: {},

                startDate: startVal,
                endDate: endVal,
                updatedAt: Date.now()

            closeModal();
            openProject(name);
            showToast(`🎉 '${escapeHtml(name)}' 여행이 시작되었습니다!`);
        }

        async function submitEditTrip() {
            const startVal = document.getElementById('edit-start-input').value;
            const endVal = document.getElementById('edit-end-input').value;
            const currVal = document.getElementById('edit-currency-select').value;
            const obCode = document.getElementById('edit-outbound-flight-input').value.trim();
            const rtCode = document.getElementById('edit-return-flight-input').value.trim();

            if (!pendingCity) {
                const curName = document.getElementById('edit-city-input').value.trim();
                pendingCity = { name: curName || tripCity, lat: tripCityLat, lng: tripCityLng };
            }
            if (!startVal || !endVal) { showToast('여행 기간을 입력해 주세요.', { type: 'error' }); return; }
            if (new Date(startVal) > new Date(endVal)) { showToast('종료일이 출발일보다 빠를 수 없습니다.', { type: 'error' }); return; }

            if (obCode && (!pendingFlights.outbound || pendingFlights.outbound.flightNo !== obCode.toUpperCase())) {
                pendingFlights.outbound = await lookupFlight(obCode, startVal);
            }
            if (rtCode && (!pendingFlights.return || pendingFlights.return.flightNo !== rtCode.toUpperCase())) {
                pendingFlights.return = await lookupFlight(rtCode, endVal);
            }
            if (!obCode) pendingFlights.outbound = null;
            if (!rtCode) pendingFlights.return = null;

            tripCity = pendingCity.name;
            tripCityLat = pendingCity.lat;
            tripCityLng = pendingCity.lng;
            tripStart = startVal;
            tripEnd = endVal;
            tripCurrency = currVal || 'KRW';
            flightsData = { outbound: pendingFlights.outbound, return: pendingFlights.return };

            closeModal();
            if (map && tripCityLat && tripCityLng) {
                map.setCenter({ lat: tripCityLat, lng: tripCityLng });
                map.setZoom(13);
            }
            generateSchedule(true);
            renderTripInfoBar();
            saveData();
            showToast('여행 정보가 성공적으로 수정되었습니다.');
        }

        function openProject(name) {
            activeProjectName = name;
            const p = allProjects[name];
            if (!p) return;

            activeShareId = p.shareId || null;
            plannerData = p.data || { 1: [] };
            hotelsData = p.hotels || {};
            mealsData = p.meals || {};
            expensesData = p.expenses || {};
            flightsData = p.flights || { outbound: null, return: null };
            tripCurrency = p.currency || 'KRW';
            currentDay = p.currentDay || 1;

            tripCity = p.city || '';
            tripCityLat = p.cityLat || null;
            tripCityLng = p.cityLng || null;
            tripStart = p.startDate;
            tripEnd = p.endDate;

            document.getElementById('lobby-screen').style.display = 'none';
            const appScreen = document.getElementById('app-screen');
            appScreen.style.display = 'flex';
            appScreen.classList.remove('shared-view');
            toggleMobileView('list');

            const centerPoint = (tripCityLat && tripCityLng) ? { lat: tripCityLat, lng: tripCityLng } : { lat: 35.6762, lng: 139.6503 };

            if (!map) {
                map = new google.maps.Map(document.getElementById('map'), {
                    zoom: 13,
                    center: centerPoint,
                    disableDefaultUI: true,
                    zoomControl: true
                });
                autocomplete = new google.maps.places.Autocomplete(document.getElementById('search-input'));
                autocomplete.bindTo('bounds', map);
                document.getElementById('search-input').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addPlace();
                    }
                });
            } else {
                google.maps.event.trigger(map, 'resize');
                map.setCenter(centerPoint);
                map.setZoom(13);
            }

            setMode('edit');
            closeAllSections();
            generateSchedule(true);
            initSortable();
            checkSuggestionsCount();
        }

        /* 📱 모바일 뷰(일정 목록 ↔ 지도) 전환 핸들러 */
        function updateMobileMapChip() {
            const chipText = document.getElementById('mobile-map-chip-text');
            if (!chipText) return;
            const city = tripCity || '여행지';
            chipText.textContent = `📍 ${city} · ${currentDay}일차`;
        }

        function toggleMobileView(target) {
            const appScreen = document.getElementById('app-screen');
            const toggleIcon = document.getElementById('mobile-view-toggle-icon');
            const toggleText = document.getElementById('mobile-view-toggle-text');
            if (!appScreen) return;

            let shouldBeMap;
            if (target === 'map') {
                shouldBeMap = true;
            } else if (target === 'list') {
                shouldBeMap = false;
            } else {
                shouldBeMap = !appScreen.classList.contains('mobile-map-active');
            }

            if (shouldBeMap) {
                appScreen.classList.add('mobile-map-active');
                if (toggleIcon) toggleIcon.textContent = '📋';
                if (toggleText) toggleText.textContent = '일정 목록';
                updateMobileMapChip();
                if (map) {
                    setTimeout(() => {
                        google.maps.event.trigger(map, 'resize');
                        updateMarkers();
                    }, 60);
                }
            } else {
                appScreen.classList.remove('mobile-map-active');
                if (toggleIcon) toggleIcon.textContent = '🗺️';
                if (toggleText) toggleText.textContent = '지도 보기';
            }
        }

        function showLobby() {
            toggleMobileView('list');
            saveData();
            activeProjectName = null;
            renderLobby();
        }

        function renderTripInfoBar() {
            const el = document.getElementById('trip-info-text');
            if (!el) return;
            el.innerHTML = `
                <span class="city-name">📍 ${escapeHtml(tripCity || '도시 미설정')}</span><br>
                <span>${escapeHtml(tripStart)} ~ ${escapeHtml(tripEnd)} (${totalTripDays}일간)</span>
            `;
            updateMobileMapChip();
        }

        function setMode(mode) {
            currentMode = mode;
            const sidebar = document.getElementById('sidebar');
            sidebar.className = mode + '-mode';
            document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');
            document.getElementById('btn-view').classList.toggle('active', mode === 'view');
            if (mode === 'view') closeAllSections();
            handleRouteDisplay();
            renderList();
            renderMapMarkers();
        }

        function generateSchedule(isLoad = false) {
            if (!tripStart || !tripEnd) return;
            const startDate = new Date(tripStart);
            const endDate = new Date(tripEnd);
            if (startDate > endDate) return;

            const diffTime = Math.abs(endDate - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            totalTripDays = diffDays;

            if (isLoad) {
                Object.keys(plannerData).forEach(d => {
                    if (Number(d) > diffDays) delete plannerData[d];
                });
                Object.keys(hotelsData).forEach(d => {
                    if (Number(d) > diffDays) delete hotelsData[d];
                });
                Object.keys(mealsData).forEach(d => {
                    if (Number(d) > diffDays) delete mealsData[d];
                });
                Object.keys(expensesData).forEach(d => {
                    if (Number(d) > diffDays) delete expensesData[d];
                });
            } else {
                plannerData = {};
            }

            tripDates = {};
            const container = document.getElementById('day-tabs-container');
            container.innerHTML = '';

            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

            for (let i = 1; i <= diffDays; i++) {
                const activeDate = new Date(startDate);
                activeDate.setDate(startDate.getDate() + (i - 1));
                const month = activeDate.getMonth() + 1;
                const day = activeDate.getDate();
                const w = weekdays[activeDate.getDay()];
                tripDates[i] = activeDate;

                if (!plannerData[i]) plannerData[i] = [];
                const placeCount = plannerData[i].length;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `day-tab ${i === currentDay ? 'active' : ''}`;
                btn.id = `tab-day-${i}`;
                btn.innerHTML = `
                    <span>${i}일차</span>
                    <span style="font-size:11px; opacity:0.85;">(${month}/${day} ${w})</span>
                    <span class="day-tab-count">${placeCount}</span>
                `;
                btn.onclick = () => changeDay(i);
                container.appendChild(btn);
            }

            if (currentDay > diffDays) currentDay = diffDays;

            renderTripInfoBar();
            changeDay(currentDay);
        }

        function changeDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
            const selected = document.getElementById(`tab-day-${day}`);
            if (selected) {
                selected.classList.add('active');
                selected.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            closeAllSections();
            saveData();
            renderList();
            updateMarkers();
            refreshExtraButtonStates();
            updateMobileMapChip();
        }

        function renderList() {
            const container = document.getElementById('planner-list-container');
            const startContainer = document.getElementById('hotel-start-container');
            const endContainer = document.getElementById('hotel-end-container');
            const flightStartContainer = document.getElementById('flight-start-container');
            const flightEndContainer = document.getElementById('flight-end-container');

            // 성능 최적화: 한 번에 모든 컨테이너 클리어
            const containers = [container, startContainer, endContainer, flightStartContainer, flightEndContainer];
            containers.forEach(c => { if (c) c.innerHTML = ''; });

            if (!plannerData[currentDay]) plannerData[currentDay] = [];
            plannerData[currentDay] = plannerData[currentDay].filter(item => item && item.lat != null && item.lng != null);
            const currentList = plannerData[currentDay];

            const { startHotel, endHotel } = getDayHotels(currentDay);
            const isFirstDay = currentDay === 1;
            const isLastDay = currentDay === totalTripDays;

            const flightArrivalPoint = (isFirstDay && flightsData.outbound && flightsData.outbound.arr)
                ? { name: `${flightsData.outbound.flightNo} 도착`, address: flightsData.outbound.arr.name || '', lat: flightsData.outbound.arr.lat, lng: flightsData.outbound.arr.lng }
                : null;
            const flightDeparturePoint = (isLastDay && flightsData.return && flightsData.return.dep)
                ? { name: `${flightsData.return.flightNo} 출발`, address: flightsData.return.dep.name || '', lat: flightsData.return.dep.lat, lng: flightsData.return.dep.lng }
                : null;

            const sequence = [];
            if (flightArrivalPoint) sequence.push(flightArrivalPoint);
            if (startHotel) sequence.push(startHotel);
            currentList.forEach(p => sequence.push(p));
            if (endHotel) sequence.push(endHotel);
            if (flightDeparturePoint) sequence.push(flightDeparturePoint);

            let seqPos = 0;
            function consumeNextLinkHTML() {
                const html = (seqPos + 1 < sequence.length) ? buildDeepLinkHTML(sequence[seqPos], sequence[seqPos + 1]) : '';
                seqPos++;
                return html;
            }

            if (flightArrivalPoint) {
                const f = flightsData.outbound;
                const airlineTag = f.airline ? ` (${escapeHtml(f.airline)})` : '';
                let html = `
                    <div class="fixed-item flight-item">
                        <div>
                            <span class="fi-label">✈️ ${escapeHtml(f.flightNo)}</span>
                            ${escapeHtml(f.dep.name || f.dep.iata || '?')} → ${escapeHtml(f.arr.name || f.arr.iata || '?')}${airlineTag}
                            <span class="fi-addr">${escapeHtml(f.dep.time || '')} 출발 → ${escapeHtml(f.arr.time || '')} 도착</span>
                        </div>
                    </div>
                `;
                html += consumeNextLinkHTML();
                flightStartContainer.innerHTML = html;
            }

            if (startHotel) {
                let html = `
                    <div class="fixed-item">
                        <div>
                            <span class="fi-label">🏨 출발</span>${escapeHtml(startHotel.name)}
                            <span class="fi-addr">${escapeHtml(startHotel.address || '')}</span>
                        </div>
                    </div>
                `;
                html += consumeNextLinkHTML();
                startContainer.innerHTML = html;
            }

            if (currentList.length === 0 && !startHotel && !endHotel && !flightArrivalPoint && !flightDeparturePoint) {
                container.innerHTML = `
                    <div class="empty-day-notice">
                        아직 ${currentDay}일차에 등록된 장소가 없습니다.<br>
                        위의 검색창에서 가고 싶은 장소를 검색해 보세요!
                    </div>
                `;
                return;
            }

            currentList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'place-item';

                let timeParts = (item.time || '10:00').split(':');
                if (timeParts.length !== 2) timeParts = ['10', '00'];

                const memoEscaped = escapeHtml(item.memo || '');
                let memoHTML = `
                    <textarea class="memo-input edit-only" rows="2" placeholder="메모나 팁을 적어두세요" onchange="updateMemo(${index}, this.value)">${memoEscaped}</textarea>
                `;
                if (memoEscaped.trim() !== '') {
                    memoHTML += `<div class="memo-text view-only">${memoEscaped}</div>`;
                }

                const mealTagHTML = item.mealType && MEAL_META[item.mealType]
                    ? `<span class="meal-tag">${MEAL_META[item.mealType].emoji} ${MEAL_META[item.mealType].label}</span>`
                    : '';

                card.innerHTML = `
                    <div class="place-header">
                        <div class="header-left">
                            <span class="place-index-badge">${index + 1}</span>
                            <div class="drag-handle edit-only" title="길게 눌러 드래그">⠿</div>
                            <div class="order-btns edit-only">
                                <button type="button" class="order-btn" onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled' : ''} aria-label="위로">▲</button>
                                <button type="button" class="order-btn" onclick="moveItem(${index}, 1)" ${index === currentList.length - 1 ? 'disabled' : ''} aria-label="아래로">▼</button>
                            </div>
                            <div class="time-wrapper edit-only">
                                <select class="time-select" onchange="updateTime(${index}, this.value, 'hour')">${generateHourOptions(timeParts[0])}</select>
                                <span class="time-colon">:</span>
                                <select class="time-select" onchange="updateTime(${index}, this.value, 'minute')">${generateMinuteOptions(timeParts[1])}</select>
                            </div>
                            <button type="button" class="ai-recommend-btn edit-only" onclick="openAiRecommendModal(${index})" title="이 장소 주변 맛집·카페·숙소 AI 추천">AI 추천</button>
                        </div>
                        <div class="time-text view-only">${escapeHtml(item.time || '10:00')}</div>
                    </div>
                    <div class="place-content">
                        <div style="cursor:pointer;" onclick="showPlaceDetails(${index})" title="장소 정보 보기">
                            <span class="place-name">${mealTagHTML}${escapeHtml(item.name)}</span>
                            <span class="place-address">${escapeHtml(item.address || '')}</span>
                        </div>
                        ${memoHTML}
                        <div class="action-group edit-only" style="margin-top:14px;">
                            <button type="button" class="move-day-btn" onclick="openMoveDayModal(${index})" title="다른 날로 이동">이동</button>
                            <button type="button" class="delete-btn" onclick="deletePlace(${index})">삭제</button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
                container.insertAdjacentHTML('beforeend', consumeNextLinkHTML());
            });

            if (endHotel) {
                let html = `
                    <div class="fixed-item">
                        <div>
                            <span class="fi-label">🏨 복귀</span>${escapeHtml(endHotel.name)}
                            <span class="fi-addr">${escapeHtml(endHotel.address || '')}</span>
                        </div>
                    </div>
                `;
                html += consumeNextLinkHTML();
                endContainer.innerHTML = html;
            }

            if (flightDeparturePoint) {
                const f = flightsData.return;
                const airlineTag = f.airline ? ` (${escapeHtml(f.airline)})` : '';
                flightEndContainer.innerHTML = `
                    <div class="fixed-item flight-item">
                        <div>
                            <span class="fi-label">✈️ ${escapeHtml(f.flightNo)}</span>
                            ${escapeHtml(f.dep.name || f.dep.iata || '?')} → ${escapeHtml(f.arr.name || f.arr.iata || '?')}${airlineTag}
                            <span class="fi-addr">${escapeHtml(f.dep.time || '')} 출발 → ${escapeHtml(f.arr.time || '')} 도착</span>
                        </div>
                    </div>
                `;
            }

            const curTab = document.getElementById(`tab-day-${currentDay}`);
            if (curTab) {
                const cntBadge = curTab.querySelector('.day-tab-count');
                if (cntBadge) cntBadge.innerText = currentList.length;
            }
        }

        function buildDeepLinkHTML(a, b) {
            if (!a || !b || a.lat == null || a.lng == null || b.lat == null || b.lng == null) return '';
            const url = `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=transit`;
            const cacheKey = `${a.lat.toFixed(5)},${a.lng.toFixed(5)}->${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
            const cached = directionsCache.get(cacheKey);

            let durationTag = '';
            if (cached && cached.duration) {
                durationTag = `<span class="transit-duration-tag">🚇 약 ${escapeHtml(cached.duration)}</span>`;
            }

            return `
                <div class="route-link-wrapper view-only">
                    <a href="${url}" target="_blank" rel="noopener" class="route-link-btn">
                        ${durationTag}
                        <span>대중교통 길찾기 ↗</span>
                    </a>
                </div>
            `;
        }

        function addPlace() {
            let place = null;
            if (autocomplete) {
                try {
                    place = autocomplete.getPlace();
                } catch (e) {}
            }

            const input = document.getElementById('search-input');
            const typedName = input ? input.value.trim() : '';

            let placeName = '';
            let placeAddress = '';
            let lat = null;
            let lng = null;
            let placeId = null;

            if (place && place.geometry && place.geometry.location) {
                placeName = place.name || place.formatted_address;
                placeAddress = place.formatted_address || '';
                lat = place.geometry.location.lat();
                lng = place.geometry.location.lng();
                placeId = place.place_id || null;
            } else if (typedName) {
                placeName = typedName;
                placeAddress = tripCity ? `${tripCity} 일대` : '직접 입력 장소';
                lat = (tripCityLat || 35.6762) + (Math.random() - 0.5) * 0.01;
                lng = (tripCityLng || 139.6503) + (Math.random() - 0.5) * 0.01;
            } else {
                showToast('장소 이름을 입력하거나 검색 목록에서 선택해 주세요.', { type: 'error' });
                return;
            }

            if (!plannerData[currentDay]) plannerData[currentDay] = [];
            const validList = plannerData[currentDay].filter(Boolean);
            let defaultTime = '10:00';
            if (validList.length > 0) {
                defaultTime = validList[validList.length - 1].time || '10:00';
            }

            plannerData[currentDay].push({
                name: placeName,
                address: placeAddress,
                lat: lat,
                lng: lng,
                placeId: placeId,
                time: defaultTime,
                memo: ''
            });

            saveData();
            renderList();
            updateMarkers();

            if (input) {
                input.value = '';
                input.blur();
            }
            showToast(`'${escapeHtml(placeName)}' 장소가 추가되었습니다.`);
        }

        function deletePlace(index) {
            const list = plannerData[currentDay];
            const item = list[index];
            if (!item) return;

            lastDeletedPlace = {
                day: currentDay,
                index: index,
                item: JSON.parse(JSON.stringify(item)),
                mealType: item.mealType || null
            };

            if (item.mealType && mealsData[currentDay]) {
                mealsData[currentDay][item.mealType] = { skip: false };
            }

            list.splice(index, 1);
            saveData();
            renderList();
            updateMarkers();
            refreshExtraButtonStates();

            showToast(`'${escapeHtml(item.name)}' 장소가 삭제되었습니다.`, {
                actionText: '되돌리기',
                duration: 6000,
                onAction: () => {
                    if (!lastDeletedPlace) return;
                    const { day, index: restIdx, item: restItem } = lastDeletedPlace;
                    if (!plannerData[day]) plannerData[day] = [];
                    plannerData[day].splice(Math.min(restIdx, plannerData[day].length), 0, restItem);

                    if (restItem.mealType) {
                        if (!mealsData[day]) mealsData[day] = {};
                        mealsData[day][restItem.mealType] = { ...restItem, skip: false };
                    }

                    lastDeletedPlace = null;
                    saveData();
                    if (currentDay === day) {
                        renderList();
                        updateMarkers();
                        refreshExtraButtonStates();
                    } else {
                        changeDay(day);
                    }
                    showToast('장소가 복원되었습니다.');
                }
            });
        }

        function openMoveDayModal(index) {
            const item = plannerData[currentDay][index];
            if (!item) return;

            let optionsHtml = '';
            for (let d = 1; d <= totalTripDays; d++) {
                if (d !== currentDay) {
                    optionsHtml += `<option value="${d}">${d}일차</option>`;
                }
            }

            if (!optionsHtml) {
                showToast('이동할 다른 일차가 없습니다.', { type: 'error' });
                return;
            }

            openModal(`
                <h3>📅 다른 날로 장소 이동</h3>
                <p style="font-size:13px; color:var(--text-body); margin-bottom:12px;">
                    <b>'${escapeHtml(item.name)}'</b> 장소를 어느 날짜로 옮기시겠습니까?
                </p>
                <div class="modal-field">
                    <label>이동할 일차</label>
                    <select id="move-target-day">${optionsHtml}</select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn secondary" onclick="closeModal()">취소</button>
                    <button type="button" class="modal-btn primary" onclick="submitMovePlace(${index})">이동하기</button>
                </div>
            `);
        }

        function submitMovePlace(index) {
            const select = document.getElementById('move-target-day');
            const targetDay = Number(select ? select.value : 0);
            if (!targetDay || targetDay === currentDay) return;

            const list = plannerData[currentDay];
            const [moved] = list.splice(index, 1);
            if (!plannerData[targetDay]) plannerData[targetDay] = [];
            plannerData[targetDay].push(moved);

            closeModal();
            saveData();
            renderList();
            updateMarkers();

            showToast(`'${escapeHtml(moved.name)}'이(가) ${targetDay}일차로 이동되었습니다.`, {
                actionText: '그 날로 가기',
                onAction: () => changeDay(targetDay)
            });
        }

        function moveItem(index, direction) {
            const list = plannerData[currentDay];
            const newIndex = index + direction;
            if (!list || newIndex < 0 || newIndex >= list.length) return;
            const temp = list[index];
            list[index] = list[newIndex];
            list[newIndex] = temp;
            saveData();
            renderList();
            updateMarkers();
        }

        function updateTime(index, val, type) {
            if (!plannerData[currentDay] || !plannerData[currentDay][index]) return;
            let parts = (plannerData[currentDay][index].time || '10:00').split(':');
            if (type === 'hour') parts[0] = val;
            else parts[1] = val;
            plannerData[currentDay][index].time = parts.join(':');
            saveData();
            renderList();
            renderMapMarkers();
        }

        function updateMemo(index, val) {
            if (!plannerData[currentDay] || !plannerData[currentDay][index]) return;
            plannerData[currentDay][index].memo = val;
            saveData();
        }

        function generateHourOptions(selectedHour) {
            let html = '';
            for (let h = 0; h < 24; h++) {
                const hh = String(h).padStart(2, '0');
                html += `<option value="${hh}" ${hh === selectedHour ? 'selected' : ''}>${hh}시</option>`;
            }
            return html;
        }

        function generateMinuteOptions(selectedMinute) {
            let html = '';
            for (let m = 0; m < 60; m += 5) {
                const mm = String(m).padStart(2, '0');
                html += `<option value="${mm}" ${mm === selectedMinute ? 'selected' : ''}>${mm}분</option>`;
            }
            return html;
        }

        function initSortable() {
            const el = document.getElementById('planner-list-container');
            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = new Sortable(el, {
                handle: '.drag-handle',
                draggable: '.place-item',
                animation: 150,
                ghostClass: 'sortable-ghost',
                forceFallback: true,
                fallbackTolerance: 3,
                delay: 100,
                delayOnTouchOnly: true,
                touchStartThreshold: 5,
                onEnd: function (evt) {
                    const fromIndex = evt.oldIndex;
                    const toIndex = evt.newIndex;
                    if (fromIndex === undefined || toIndex === undefined || fromIndex === toIndex) {
                        renderList();
                        return;
                    }
                    const list = plannerData[currentDay];
                    const moved = list.splice(fromIndex, 1)[0];
                    list.splice(toIndex, 0, moved);
                    saveData();
                    renderList();
                    updateMarkers();
                }
            });
        }

        function closeAllSections() {
            ['hotel', 'meal', 'expense'].forEach(s => {
                const el = document.getElementById(s + '-section');

        function getEffectiveHotel(day) {
            for (let d = day; d >= 1; d--) {
                if (hotelsData[d] && hotelsData[d].name) return hotelsData[d];
            }
            return null;
        }

        function getDayHotels(day) {
            const isLastDay = day >= totalTripDays;
            const endHotel = isLastDay ? null : getEffectiveHotel(day);
            const startHotel = day > 1 ? getEffectiveHotel(day - 1) : null;
            return { startHotel, endHotel };
        }

        function syncMealItemsIntoList() {
            if (!plannerData[currentDay]) plannerData[currentDay] = [];
            const dayMeals = mealsData[currentDay] || {};

            plannerData[currentDay] = plannerData[currentDay].filter(item => !item.mealType);

            Object.keys(MEAL_META).forEach(slot => {
                const info = dayMeals[slot];
                if (info && info.name && !info.skip) {
                    const newMeal = {
                        name: info.name,
                        address: info.address || '',
                        lat: info.lat,
                        lng: info.lng,
                        time: MEAL_META[slot].time,
                        memo: '',
                        mealType: slot
                    };

                    const insertIdx = plannerData[currentDay].findIndex(item => (item.time || '00:00') > newMeal.time);
                    if (insertIdx === -1) {
                        plannerData[currentDay].push(newMeal);
                    } else {
                        plannerData[currentDay].splice(insertIdx, 0, newMeal);
                    }
                }
            });
        }

        async function fetchAirportCoords(iataCode) {
            if (!iataCode) return null;
            try {
                const url = `https://api.aviationstack.com/v1/airports?access_key=${AVIATIONSTACK_API_KEY}&iata_code=${encodeURIComponent(iataCode)}`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const json = await res.json();
                const a = json.data && json.data[0];
                if (!a) return null;
                return {
                    name: a.airport_name || iataCode,
                    lat: (a.latitude != null) ? Number(a.latitude) : null,
                    lng: (a.longitude != null) ? Number(a.longitude) : null
                };
            } catch (e) {
                return null;
            }
        }

        function extractLocalTime(scheduledStr) {
            if (!scheduledStr) return '';
            const m = scheduledStr.match(/T(\d{2}:\d{2})/);
            return m ? m[1] : '';
        }

        async function lookupFlight(flightNo, dateStr) {
            if (!flightNo || !dateStr || !AVIATIONSTACK_API_KEY) return null;

            try {
                const url = `https://api.aviationstack.com/v1/flights?access_key=${AVIATIONSTACK_API_KEY}&flight_iata=${encodeURIComponent(flightNo.trim())}&flight_date=${dateStr}`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const json = await res.json();
                if (json.error || !Array.isArray(json.data) || json.data.length === 0) return null;

                const f = json.data[0];
                const dep = f.departure || {};
                const arr = f.arrival || {};

                const [depCoords, arrCoords] = await Promise.all([
                    fetchAirportCoords(dep.iata),
                    fetchAirportCoords(arr.iata)
                ]);

                return {
                    flightNo: flightNo.trim().toUpperCase(),
                    date: dateStr,
                    dep: {
                        iata: dep.iata || '',
                        name: (depCoords && depCoords.name) || dep.airport || dep.iata || '',
                        lat: depCoords ? depCoords.lat : null,
                        lng: depCoords ? depCoords.lng : null,
                        time: extractLocalTime(dep.scheduled)
                    },
                    arr: {
                        iata: arr.iata || '',
                        name: (arrCoords && arrCoords.name) || arr.airport || arr.iata || '',
                        lat: arrCoords ? arrCoords.lat : null,
                        lng: arrCoords ? arrCoords.lng : null,
                        time: extractLocalTime(arr.scheduled)
                    }
                };
            } catch (e) {
                return null;
            }
        }

        async function lookupFlightForModal(type, prefix) {
            const codeInput = document.getElementById(`${prefix}-${type}-flight-input`);
            const previewEl = document.getElementById(`${prefix}-${type}-flight-preview`);
            const code = codeInput ? codeInput.value.trim() : '';
            if (!code) { showToast('항공편 편명을 입력해 주세요.', { type: 'error' }); return; }

            const dateInput = document.getElementById(type === 'outbound' ? `${prefix}-start-input` : `${prefix}-end-input`);
            const dateVal = dateInput ? dateInput.value : '';
            if (!dateVal) { showToast('여행 기간(날짜)을 먼저 선택해 주세요.', { type: 'error' }); return; }

            previewEl.innerText = '항공편 조회 중...';
            const result = await lookupFlight(code, dateVal);

            if (result) {
                pendingFlights[type] = result;
                previewEl.innerHTML = flightPreviewText(result);
                showToast('항공편 정보가 조회되었습니다!');
            } else {
                pendingFlights[type] = null;
                previewEl.innerHTML = '<span style="color:var(--text-muted); font-size:12px;">ℹ️ 자동 조회 결과가 없습니다. 아래 [직접 입력]을 확인해 주세요.</span>';
                const manualFields = document.getElementById(`${prefix}-${type}-manual-fields`);
                if (manualFields) {
                    manualFields.classList.add('open');
                    initManualAirportAutocomplete(type, prefix);
                }
            }
        }

        function initManualAirportAutocomplete(type, prefix) {
            if (!(window.google && google.maps && google.maps.places)) return;
            const depInput = document.getElementById(`${prefix}-${type}-depairport-input`);

                    const place = ac.getPlace();
                    if (place && place.geometry) {

                            lat: place.geometry.location.lat(),
                            lng: place.geometry.location.lng()
                        };
                    }
                });
                depInput._acAttached = true;
            }

            if (arrInput && !arrInput._acAttached) {
                const ac2 = new google.maps.places.Autocomplete(arrInput);
                ac2.addListener('place_changed', () => {
                    const place = ac2.getPlace();
                    if (place && place.geometry) {

                            lat: place.geometry.location.lat(),
                            lng: place.geometry.location.lng()

                service.getDetails({ placeId: item.placeId, fields }, (place, status) => {

                });
            } else {
                service.findPlaceFromQuery({
                    query: item.name,
                    fields: ['place_id'],
                    locationBias: new google.maps.Circle({ center: { lat: item.lat, lng: item.lng }, radius: 400 })

                            else renderNoInfo();
                        });

                    }
                });

        function addAiRecommendationToTrip(baseIndex, recIndex, customTime) {
            const currentList = plannerData[currentDay];
            if (!currentList || !currentList[baseIndex]) return;
            const baseItem = currentList[baseIndex];
            const rec = currentAiActiveList[recIndex];
            if (!rec) return;

            // 좌표 결정: Google Places 정보가 있으면 100% 정밀 좌표, 없으면 기준 장소 인근 오프셋 좌표
            let lat = baseItem.lat;
            let lng = baseItem.lng;
            let address = baseItem.address || '';
            let placeId = null;

            if (rec.googlePlace && rec.googlePlace.geometry && rec.googlePlace.geometry.location) {
                lat = typeof rec.googlePlace.geometry.location.lat === 'function' 
                    ? rec.googlePlace.geometry.location.lat() 
                    : rec.googlePlace.geometry.location.lat;
                lng = typeof rec.googlePlace.geometry.location.lng === 'function' 
                    ? rec.googlePlace.geometry.location.lng() 
                    : rec.googlePlace.geometry.location.lng;
                address = rec.googlePlace.formatted_address || address;
                placeId = rec.googlePlace.place_id || null;
            } else {
                // 살짝 오프셋을 주어 지도 마커가 겹치지 않게 함
                lat = lat + (Math.random() - 0.5) * 0.003;
                lng = lng + (Math.random() - 0.5) * 0.003;
            }

            // 시간 설정: 사용자가 선택한 시간 또는 기본 시간
            let newTime = customTime || '12:00';
            if (!customTime && baseItem.time && baseItem.time.includes(':')) {
                const [hh, mm] = baseItem.time.split(':').map(Number);
                const nextHour = Math.min(23, (hh || 10) + 1);
                newTime = `${String(nextHour).padStart(2, '0')}:${String(mm || 0).padStart(2, '0')}`;
            }

            // 메모 구성: 대표 메뉴 및 꿀팁
            const memoParts = [];
            if (rec.signatureMenu) memoParts.push(`대표메뉴: ${rec.signatureMenu}`);
            if (rec.priceRange) memoParts.push(`가격대: ${rec.priceRange}`);
            if (rec.tip) memoParts.push(`💡 ${rec.tip}`);
            const memoText = memoParts.join('\n');

            // 식사 타입 매핑 (맛집/카페인 경우)
            let mealType = null;
            if (rec.category === 'restaurant') {
                const hour = parseInt(newTime.split(':')[0], 10);
                mealType = hour >= 16 ? 'dinner' : 'lunch';
            } else if (rec.category === 'cafe') {
                mealType = 'cafe';
            }

            const newPlaceItem = {
                name: rec.name,
                address: address,
                lat: lat,
                lng: lng,
                time: newTime,
                memo: memoText,
                mealType: mealType,
                placeId: placeId
            };

            // 기준 장소 바로 다음 위치에 삽입
            currentList.splice(baseIndex + 1, 0, newPlaceItem);

            saveCurrentProject();
            renderList();
            renderMapMarkers();

            // AI 추천 모달 닫기 (화면에서 추가된 일정 즉시 보이게)
            closeModal();

            // 추가 완료 토스트 표시
            showToast(`'${escapeHtml(rec.name)}'이(가) ${currentDay}일차 일정에 추가되었습니다!`);
        }

        const ZONE_DISTANCE_THRESHOLD_KM = 20;

        function haversineKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function computeDayZones(day) {
            const list = plannerData[day] || [];
            const zones = [];
            list.forEach((item, idx) => {
                if (!item || item.lat == null || item.lng == null) return;
                if (zones.length === 0) { zones.push({ indices: [idx] }); return; }
                const lastZone = zones[zones.length - 1];
                const lastItem = list[lastZone.indices[lastZone.indices.length - 1]];
                const dist = haversineKm(lastItem.lat, lastItem.lng, item.lat, item.lng);
                if (dist > ZONE_DISTANCE_THRESHOLD_KM) zones.push({ indices: [idx] });
                else lastZone.indices.push(idx);
            });
            return zones;
        }

        function zoneCentroid(zone, list) {
            const pts = zone.indices.map(i => list[i]);
            return {
                lat: pts.reduce((s, p) => s + p.lat, 0) / pts.length,
                lng: pts.reduce((s, p) => s + p.lng, 0) / pts.length
            };
        }

        function nearestZoneIndexForPoint(zones, list, point) {
            let best = 0, bestDist = Infinity;
            zones.forEach((zone, idx) => {
                const c = zoneCentroid(zone, list);
                const d = haversineKm(c.lat, c.lng, point.lat, point.lng);
                if (d < bestDist) { bestDist = d; best = idx; }
            });
            return best;
        }

        function updateMarkers() {
            markers.forEach(m => m.setMap(null));
            markers = [];
            if (!plannerData[currentDay] || !map) return;

            const list = plannerData[currentDay];
            const dayZones = computeDayZones(currentDay);
            const multiZone = dayZones.length > 1;
            activeZoneIndex = multiZone ? dayZones.length - 1 : 0;
            const activeIndices = multiZone ? new Set(dayZones[activeZoneIndex].indices) : null;

            const bounds = new google.maps.LatLngBounds();
            let hasBoundsPoint = false;

            const { startHotel, endHotel } = getDayHotels(currentDay);
            const placedHotelKeys = new Set();

            [startHotel, endHotel].forEach(h => {
                if (!h || h.lat == null || h.lng == null) return;
                if (multiZone && nearestZoneIndexForPoint(dayZones, list, h) !== activeZoneIndex) return;
                const key = h.lat + ',' + h.lng;
                if (placedHotelKeys.has(key)) return;
                placedHotelKeys.add(key);
                const pos = { lat: h.lat, lng: h.lng };
                const hotelMarker = new google.maps.Marker({
                    map: map,
                    position: pos,
                    title: h.name,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 9,
                        fillColor: '#1E3A5F',
                        fillOpacity: 1,
                        strokeColor: '#ffffff',
                        strokeWeight: 2
                    }
                });
                markers.push(hotelMarker);
                bounds.extend(pos);
                hasBoundsPoint = true;
            });

            let shownItemCount = 0;
            list.forEach((item, index) => {
                if (!item || item.lat == null || item.lng == null) return;
                if (multiZone && !activeIndices.has(index)) return;
                shownItemCount++;
                const pos = { lat: item.lat, lng: item.lng };
                const marker = new google.maps.Marker({
                    map: map,
                    position: pos,
                    label: {
                        text: String(index + 1),
                        color: '#ffffff',
                        fontWeight: 'bold',
                        fontSize: '12px'
                    },
                    title: item.name
                });
                markers.push(marker);
                bounds.extend(pos);
                hasBoundsPoint = true;
            });

            const totalPoints = shownItemCount + placedHotelKeys.size;
            if (hasBoundsPoint && totalPoints > 1) {
                map.fitBounds(bounds);
            } else if (hasBoundsPoint) {
                map.setCenter(bounds.getCenter());
                map.setZoom(15);
            }

            handleRouteDisplay();
        }

        function clearRoutes() {
            directionsRenderers.forEach(r => r.setMap(null));
            directionsRenderers = [];
            fallbackPolylines.forEach(p => p.setMap(null));
            fallbackPolylines = [];
        }

        function handleRouteDisplay() {
            clearRoutes();
            if (currentMode === 'view') drawRoutesForViewMode();
        }

        function renderMapMarkers() {
            // 지도 마커 렌더링 함수 (현재는 handleRouteDisplay로 대체)
            // 향후 구현 예정
            if (typeof handleRouteDisplay === 'function') {
                // handleRouteDisplay();

        function drawRoutesForViewMode() {
            if (!plannerData[currentDay] || !map) return;

            const dayItems = plannerData[currentDay];
            const dayZones = computeDayZones(currentDay);
            const multiZone = dayZones.length > 1;
            const activeIndices = multiZone ? new Set(dayZones[Math.min(activeZoneIndex, dayZones.length - 1)].indices) : null;

            const { startHotel, endHotel } = getDayHotels(currentDay);
            const list = [];

            if (startHotel && startHotel.lat != null && startHotel.lng != null &&
                (!multiZone || nearestZoneIndexForPoint(dayZones, dayItems, startHotel) === activeZoneIndex)) {
                list.push(startHotel);
            }
            dayItems.forEach((p, idx) => {
                if (!p || !p.lat || !p.lng) return;
                if (multiZone && !activeIndices.has(idx)) return;
                list.push(p);
            });
            if (endHotel && endHotel.lat != null && endHotel.lng != null &&
                (!multiZone || nearestZoneIndexForPoint(dayZones, dayItems, endHotel) === activeZoneIndex)) {
                list.push(endHotel);
            }

            if (list.length < 2) return;
            if (!directionsService) directionsService = new google.maps.DirectionsService();

            for (let i = 0; i < list.length - 1; i++) {
                const origin = { lat: list[i].lat, lng: list[i].lng };
                const destination = { lat: list[i + 1].lat, lng: list[i + 1].lng };
                const cacheKey = `${origin.lat.toFixed(5)},${origin.lng.toFixed(5)}->${destination.lat.toFixed(5)},${destination.lng.toFixed(5)}`;

                const renderer = new google.maps.DirectionsRenderer({
                    map: map,
                    suppressMarkers: true,
                    preserveViewport: true,
                    polylineOptions: { strokeColor: '#2563EB', strokeWeight: 4, strokeOpacity: 0.85 }
                });
                directionsRenderers.push(renderer);

                if (directionsCache.has(cacheKey)) {
                    const cached = directionsCache.get(cacheKey);
                    if (cached.status === 'OK' && cached.result) {
                        renderer.setDirections(cached.result);
                    } else {
                        drawDashedFallback(origin, destination);
                    }
                    continue;
                }

                directionsService.route(
                    { origin, destination, travelMode: google.maps.TravelMode.TRANSIT },
                    (result, status) => {
                        if (status === 'OK' && result && result.routes && result.routes[0]) {
                            renderer.setDirections(result);
                            const leg = result.routes[0].legs[0];
                            directionsCache.set(cacheKey, {
                                status: 'OK',
                                result: result,
                                duration: leg ? leg.duration.text : '',
                                distance: leg ? leg.distance.text : ''
                            });
                        } else {
                            renderer.setMap(null);
                            directionsCache.set(cacheKey, { status: 'FAILED' });
                            drawDashedFallback(origin, destination);
                        }
                    }
                );
            }
        }

        function drawDashedFallback(origin, destination) {
            const line = new google.maps.Polyline({
                path: [origin, destination],
                strokeOpacity: 0,
                icons: [{
                    icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 },
                    offset: '0',
                    repeat: '10px'
                }],
                strokeColor: '#1E3A5F',
                map: map
            });
            fallbackPolylines.push(line);
        }

        function startSharedPolling() {
            if (sharedPollTimer) clearInterval(sharedPollTimer);

            const pollAction = async () => {
                if (!currentSharedId || document.visibilityState === 'hidden') return;
                try {
                    const res = await fetch(`${FIREBASE_DB_URL}/shares/${currentSharedId}.json`);
                    const payload = await res.json();
                    if (!payload) return;
                    const str = JSON.stringify(payload);
                    if (str === lastSharedPayloadStr) return;
                    lastSharedPayloadStr = str;
                    applySharedUpdate(payload);
                } catch (e) {}
            };

            sharedPollTimer = setInterval(pollAction, 10000);

            if (!window._sharedVisibilityAttached) {
                window._sharedVisibilityAttached = true;
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        pollAction();
                    }
                });
            }
        }

        async function acceptSuggestion(id) {
            const p = (window.currentSuggestionsCache || {})[id];
            if (!p) return;
            const day = p.day || 1;

            if (!plannerData[day]) plannerData[day] = [];
            const validList = plannerData[day].filter(Boolean);
            let defaultTime = validList.length > 0 ? (validList[validList.length - 1].time || '10:00') : '10:00';

            let memo = p.proposer ? `[${p.proposer}님 추천] ` : '';
            if (p.memo) memo += p.memo;

            plannerData[day].push({
                name: p.name,
                address: p.address,
                lat: p.lat,
                lng: p.lng,
                time: defaultTime,
                memo
            });

            saveData();
            await fetch(`${FIREBASE_DB_URL}/suggestions/${activeShareId}/${id}.json`, { method: 'DELETE' }).catch(() => {});
            delete window.currentSuggestionsCache[id];
            renderSuggestionList(window.currentSuggestionsCache);
            changeDay(day);
            showToast(`'${escapeHtml(p.name)}' 장소가 ${day}일차에 추가되었습니다!`);
        }

        function copyItineraryText() {
            let text = `✈️ [${activeProjectName || sharedProjectName}]\n`;
            text += `📍 목적지: ${tripCity}\n`;
            text += `📅 기간: ${tripStart} ~ ${tripEnd} (${totalTripDays}일간)\n\n`;

            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

            for (let d = 1; d <= totalTripDays; d++) {
                const dateObj = tripDates[d];
                const dateStr = dateObj ? `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${weekdays[dateObj.getDay()]})` : '';
                text += `━━━━━━━━━━━━━━━━━━━━\n`;
                text += `[${d}일차] ${dateStr}\n`;

                if (d === 1 && flightsData.outbound) {
                    text += `✈️ 도착: ${flightsData.outbound.flightNo} (${flightsData.outbound.arr.name || ''})\n`;
                }

                const hotel = getEffectiveHotel(d);
                if (hotel) text += `🏨 숙소: ${hotel.name}\n`;

                const items = plannerData[d] || [];
                if (items.length === 0) {
                    text += `  (자유 일정)\n`;
                } else {
                    items.forEach((item, idx) => {
                        const meal = item.mealType ? `[${MEAL_META[item.mealType].label}] ` : '';
                        text += `  ${idx + 1}. ${item.time || ''} ${meal}${item.name}\n`;
                        if (item.memo) text += `     ㄴ 📝 ${item.memo}\n`;
                    });
                }

                if (d === totalTripDays && flightsData.return) {
                    text += `✈️ 귀국: ${flightsData.return.flightNo} (${flightsData.return.dep.name || ''})\n`;
                }
                text += `\n`;
            }

            navigator.clipboard.writeText(text).then(() => {
                showToast('전체 일정이 텍스트로 복사되었습니다!');
            }).catch(() => {
                showToast('클립보드 복사에 실패했습니다.', { type: 'error' });
            });
        }
