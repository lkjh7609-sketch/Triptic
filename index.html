                    <button type="button" class="modal-btn primary" onclick="exportToPDF('all')">📚 전체 일정 통합 PDF (${totalTripDays}일치)</button>
                    <button type="button" class="modal-btn secondary" onclick="exportToPDF('current')">📄 현재 ${currentDay}일차만 PDF 출력</button>
                    <button type="button" class="modal-btn secondary" onclick="closeModal()">닫기</button>
                </div>
            `);
        }

        let cachedKoreanFontBase64 = null;

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        async function ensureKoreanFont(pdf) {
            if (!cachedKoreanFontBase64) {
                const fontUrl = 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/nanumgothic/NanumGothic-Regular.ttf';
                const res = await fetch(fontUrl);
                if (!res.ok) throw new Error('Font load failed');
                const buffer = await res.arrayBuffer();
                cachedKoreanFontBase64 = arrayBufferToBase64(buffer);
            }
            pdf.addFileToVFS('NanumGothic.ttf', cachedKoreanFontBase64);
            pdf.addFont('NanumGothic.ttf', 'NanumGothic', 'normal');
            pdf.setFont('NanumGothic', 'normal');
        }

        function cleanPdfText(str) {
            if (!str) return '';
            return String(str)
                .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
                .replace(/[\u{1F600}-\u{1F64F}]/gu, '')
                .replace(/[\u{1F680}-\u{1F6FF}]/gu, '')
                .replace(/[\u{2600}-\u{27BF}]/gu, '')
                .replace(/[\u{FE00}-\u{FE0F}]/gu, '')
                .replace(/[\u{1F900}-\u{1F9FF}]/gu, '')
                .replace(/[\u{200D}]/gu, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function exportToPDF(exportMode = 'all') {
            closeModal();
            showToast('⏳ 고화질 여행 일정표 PDF를 생성하고 있습니다...', { duration: 3500 });

            try {
                window.jsPDF = window.jspdf.jsPDF;
                const pdf = new jsPDF('p', 'mm', 'a4');
                await ensureKoreanFont(pdf);

                const pageW = 210, pageH = 297;
                const marginL = 14, marginR = 14, marginT = 14, marginB = 14;
                const usableW = pageW - marginL - marginR; // 182mm

                const C_NAVY    = [30, 58, 95];
                const C_BLUE    = [37, 99, 235];
                const C_TEXT    = [15, 23, 42];
                const C_MUTED   = [71, 85, 105];
                const C_LINE    = [226, 232, 240];
                const C_BG_ALT  = [248, 250, 252];
                const C_CARD    = [250, 251, 253];
                const C_SEC_BG  = [241, 245, 249];

                // Table columns: 22 + 26 + 78 + 56 = 182mm
                const colW_time = 22;
                const colW_type = 26;
                const colW_name = 78;
                const colW_note = 56;

                const colX_time = marginL;
                const colX_type = colX_time + colW_time;
                const colX_name = colX_type + colW_type;
                const colX_note = colX_name + colW_name;

                let y = marginT;
                let currentDayNum = 1;

                function newPage(isContinuation = false) {
                    pdf.addPage();
                    y = marginT;
                    if (isContinuation) {
                        pdf.setFontSize(8);
                        pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                        const headText = `${cleanPdfText(tripCity) || '여행'} 일정표 · ${currentDayNum}일차 (계속)`;
                        pdf.text(headText, marginL, y + 3);
                        pdf.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
                        pdf.setLineWidth(0.2);
                        pdf.line(marginL, y + 5, pageW - marginR, y + 5);
                        y += 9;
                    }
                }

                function ensureSpace(needMm, isContinuation = true) {
                    if (y + needMm > pageH - marginB) {
                        newPage(isContinuation);
                        return true;
                    }
                    return false;
                }

                function drawSectionHeader(title) {
                    ensureSpace(12, false);
                    const h = 6.2;
                    pdf.setFillColor(C_SEC_BG[0], C_SEC_BG[1], C_SEC_BG[2]);
                    pdf.rect(marginL, y, usableW, h, 'F');

                    pdf.setFillColor(C_NAVY[0], C_NAVY[1], C_NAVY[2]);
                    pdf.rect(marginL, y, 2.5, h, 'F');

                    pdf.setFontSize(9);
                    pdf.setTextColor(C_NAVY[0], C_NAVY[1], C_NAVY[2]);
                    pdf.text(title, marginL + 5, y + 4.4);
                    pdf.text(title, marginL + 5.1, y + 4.4);
                    y += h + 3.0;
                }

                function drawTableHeader() {
                    const h = 7.5;
                    pdf.setFillColor(C_NAVY[0], C_NAVY[1], C_NAVY[2]);
                    pdf.rect(marginL, y, usableW, h, 'F');

                    pdf.setFontSize(8.5);
                    pdf.setTextColor(255, 255, 255);
                    const headers = [
                        { text: '시간', x: colX_time + colW_time / 2, align: 'center' },
                        { text: '구분', x: colX_type + colW_type / 2, align: 'center' },
                        { text: '일정 및 장소', x: colX_name + 3, align: 'left' },
                        { text: '이동 및 비고', x: colX_note + 3, align: 'left' }
                    ];
                    headers.forEach(hd => {
                        if (hd.align === 'center') {
                            pdf.text(hd.text, hd.x, y + 5.0, { align: 'center' });
                            pdf.text(hd.text, hd.x + 0.1, y + 5.0, { align: 'center' });
                        } else {
                            pdf.text(hd.text, hd.x, y + 5.0);
                            pdf.text(hd.text, hd.x + 0.1, y + 5.0);
                        }
                    });
                    y += h;
                }

                function drawTableRow(row, isAlt) {
                    const timeStr = cleanPdfText(row.time || '-');
                    const typeStr = cleanPdfText(row.type || '');
                    const nameStr = cleanPdfText(row.name || '');
                    const noteStr = cleanPdfText(row.note || '-');

                    pdf.setFontSize(8.5);
                    const nameLines = pdf.splitTextToSize(nameStr, colW_name - 6);
                    pdf.setFontSize(8);
                    const noteLines = pdf.splitTextToSize(noteStr, colW_note - 6);

                    const maxLines = Math.max(1, nameLines.length, noteLines.length);
                    const rowH = Math.max(7.5, maxLines * 4.2 + 3.2);

                    if (ensureSpace(rowH)) {
                        drawTableHeader();
                    }

                    if (isAlt) {
                        pdf.setFillColor(C_BG_ALT[0], C_BG_ALT[1], C_BG_ALT[2]);
                        pdf.rect(marginL, y, usableW, rowH, 'F');
                    }

                    // Row bottom border
                    pdf.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
                    pdf.setLineWidth(0.15);
                    pdf.line(marginL, y + rowH, pageW - marginR, y + rowH);

                    // Col 1: 시간
                    pdf.setFontSize(8.5);
                    pdf.setTextColor(C_TEXT[0], C_TEXT[1], C_TEXT[2]);
                    pdf.text(timeStr, colX_time + colW_time / 2, y + 5.0, { align: 'center' });

                    // Col 2: 구분
                    pdf.setFontSize(8);
                    if (row.isFlight) {
                        pdf.setTextColor(C_NAVY[0], C_NAVY[1], C_NAVY[2]);
                    } else if (row.isHotel) {
                        pdf.setTextColor(C_BLUE[0], C_BLUE[1], C_BLUE[2]);
                    } else if (row.isMeal) {
                        pdf.setTextColor(180, 83, 9);
                    } else {
                        pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                    }
                    pdf.text(typeStr, colX_type + colW_type / 2, y + 5.0, { align: 'center' });

                    // Col 3: 일정 및 장소
                    pdf.setFontSize(8.5);
                    pdf.setTextColor(C_TEXT[0], C_TEXT[1], C_TEXT[2]);
                    let curLineY = y + 5.0;
                    nameLines.forEach(ln => {
                        pdf.text(ln, colX_name + 3, curLineY);
                        if (row.isBold) pdf.text(ln, colX_name + 3.1, curLineY);
                        curLineY += 4.2;
                    });

                    // Col 4: 이동 및 비고
                    pdf.setFontSize(8);
                    pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                    curLineY = y + 5.0;
                    noteLines.forEach(ln => {
                        pdf.text(ln, colX_note + 3, curLineY);
                        curLineY += 4.2;
                    });

                    y += rowH;
                }

                function drawPlaceDetailCard(cardData) {
                    const name = cleanPdfText(cardData.name);
                    const tag = cleanPdfText(cardData.tag);
                    const time = cleanPdfText(cardData.time);
                    const address = cleanPdfText(cardData.address);
                    const memo = cleanPdfText(cardData.memo);
                    const transit = cleanPdfText(cardData.transit);

                    const textW = usableW - 10;
                    pdf.setFontSize(8);
                    const addrLines = address ? pdf.splitTextToSize(`[주소] ${address}`, textW) : [];
                    const memoLines = memo ? pdf.splitTextToSize(`[메모] ${memo}`, textW) : [];
                    const transitLines = transit ? pdf.splitTextToSize(`[이동 안내] ${transit}`, textW) : [];

                    const lineH = 3.9;
                    let innerH = 6.0;
                    if (addrLines.length > 0) innerH += addrLines.length * lineH + 1.0;
                    if (memoLines.length > 0) innerH += memoLines.length * lineH + 1.2;
                    if (transitLines.length > 0) innerH += transitLines.length * lineH + 1.0;

                    const cardH = innerH + 3.0;

                    if (ensureSpace(cardH + 3.0)) {
                        drawSectionHeader('2. 장소별 상세 안내 & 메모 (계속)');
                    }

                    // Card background & border
                    pdf.setFillColor(C_CARD[0], C_CARD[1], C_CARD[2]);
                    pdf.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
                    pdf.setLineWidth(0.2);
                    pdf.roundedRect(marginL, y, usableW, cardH, 1.2, 1.2, 'FD');

                    // Left accent bar
                    const accentColor = cardData.accentColor || C_NAVY;
                    pdf.setFillColor(accentColor[0], accentColor[1], accentColor[2]);
                    pdf.rect(marginL, y, 1.8, cardH, 'F');

                    // Header line inside card
                    let cardY = y + 5.0;
                    pdf.setFontSize(9.5);
                    pdf.setTextColor(C_NAVY[0], C_NAVY[1], C_NAVY[2]);
                    pdf.text(name, marginL + 5, cardY);
                    pdf.text(name, marginL + 5.1, cardY);

                    // Right tags: Time & Category
                    let rightTagStr = '';
                    if (time) rightTagStr += `[${time}] `;
                    if (tag) rightTagStr += tag;
                    if (rightTagStr) {
                        pdf.setFontSize(8);
                        pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                        pdf.text(rightTagStr, pageW - marginR - 4, cardY, { align: 'right' });
                    }

                    // Address lines
                    if (addrLines.length > 0) {
                        cardY += 4.5;
                        pdf.setFontSize(8);
                        pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                        addrLines.forEach(ln => {
                            pdf.text(ln, marginL + 5, cardY);
                            cardY += lineH;
                        });
                    }

                    // Memo lines
                    if (memoLines.length > 0) {
                        cardY += 4.5;
                        pdf.setFontSize(8);
                        pdf.setTextColor(C_TEXT[0], C_TEXT[1], C_TEXT[2]);
                        memoLines.forEach(ln => {
                            pdf.text(ln, marginL + 5, cardY);
                            cardY += lineH;
                        });
                    }

                    // Transit guidance
                    if (transitLines.length > 0) {
                        cardY += 4.5;
                        pdf.setFontSize(7.8);
                        pdf.setTextColor(C_BLUE[0], C_BLUE[1], C_BLUE[2]);
                        transitLines.forEach(ln => {
                            pdf.text(ln, marginL + 5, cardY);
                            cardY += lineH;
                        });
                    }

                    y += cardH + 2.8;
                }

                const targetDays = exportMode === 'all'
                    ? Array.from({ length: totalTripDays }, (_, i) => i + 1)
                    : [currentDay];

                targetDays.forEach((dayNum, loopIdx) => {
                    currentDayNum = dayNum;
                    if (loopIdx > 0) newPage(false);

                    const dateObj = tripDates[dayNum];
                    const dateStr = dateObj ? dateObj.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }) : '';

                    // Main Day Header Banner
                    pdf.setFontSize(8);
                    pdf.setTextColor(C_BLUE[0], C_BLUE[1], C_BLUE[2]);
                    pdf.text('TRIPTIC ITINERARY GUIDE', marginL, y + 2);

                    y += 5.5;
                    pdf.setFontSize(15);
                    pdf.setTextColor(C_NAVY[0], C_NAVY[1], C_NAVY[2]);
                    const dayTitle = `${cleanPdfText(tripCity) || '여행'} 일정표 · ${dayNum}일차 (DAY ${dayNum})`;
                    pdf.text(dayTitle, marginL, y + 2);
                    pdf.text(dayTitle, marginL + 0.15, y + 2);

                    y += 6.5;
                    pdf.setFontSize(8.5);
                    pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                    const periodText = `여행 기간: ${cleanPdfText(tripStart)} ~ ${cleanPdfText(tripEnd)} (총 ${totalTripDays}일 중 ${dayNum}일차)  |  ${cleanPdfText(dateStr)}`;
                    pdf.text(periodText, marginL, y + 2);

                    y += 5.0;
                    pdf.setDrawColor(C_NAVY[0], C_NAVY[1], C_NAVY[2]);
                    pdf.setLineWidth(0.6);
                    pdf.line(marginL, y, pageW - marginR, y);
                    y += 6.0;

                    const isFirst = dayNum === 1;
                    const isLast = dayNum === totalTripDays;
                    const { startHotel, endHotel } = getDayHotels(dayNum);
                    const flightArrival = (isFirst && flightsData.outbound) ? flightsData.outbound : null;
                    const flightDeparture = (isLast && flightsData.return) ? flightsData.return : null;
                    const dayItems = (plannerData[dayNum] || []).filter(item => item && item.name);
                    const dayExpenses = expensesData[dayNum] || [];

                    // Sequence for transit calculations
                    const seq = [];
                    if (flightArrival && flightArrival.arr) {
                        seq.push({
                            name: `${flightArrival.flightNo} 도착`,
                            lat: flightArrival.arr.lat,
                            lng: flightArrival.arr.lng,
                            address: flightArrival.arr.name || ''
                        });
                    }
                    if (startHotel) seq.push(startHotel);
                    dayItems.forEach(p => seq.push(p));
                    if (endHotel) seq.push(endHotel);
                    if (flightDeparture && flightDeparture.dep) {
                        seq.push({
                            name: `${flightDeparture.flightNo} 출발`,
                            lat: flightDeparture.dep.lat,
                            lng: flightDeparture.dep.lng,
                            address: flightDeparture.dep.name || ''
                        });
                    }

                    function getTransitToNext(itemObj) {
                        const idx = seq.indexOf(itemObj);
                        if (idx !== -1 && idx + 1 < seq.length) {
                            const a = seq[idx];
                            const b = seq[idx + 1];
                            if (a && b && a.lat != null && a.lng != null && b.lat != null && b.lng != null) {
                                const cacheKey = `${a.lat.toFixed(5)},${a.lng.toFixed(5)}->${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
                                const cached = directionsCache.get(cacheKey);
                                if (cached && cached.duration) {
                                    return {
                                        duration: cached.duration,
                                        nextName: b.name
                                    };
                                }
                            }
                        }
                        return null;
                    }

                    // 1. Build Table Rows
                    const tableRows = [];
                    if (flightArrival) {
                        const transitInfo = seq.length > 0 ? getTransitToNext(seq[0]) : null;
                        const noteParts = [];
                        if (flightArrival.airline) noteParts.push(flightArrival.airline);
                        if (transitInfo) noteParts.push(`이동 약 ${transitInfo.duration}`);
                        tableRows.push({
                            time: flightArrival.arr.time || '도착',
                            type: '[항공 · 도착]',
                            name: `${flightArrival.flightNo} (${flightArrival.dep.iata || flightArrival.dep.name || '?'} → ${flightArrival.arr.iata || flightArrival.arr.name || '?'})`,
                            note: noteParts.join(' | ') || '공항 도착 및 입국',
                            isFlight: true,
                            isBold: true
                        });
                    }

                    if (startHotel) {
                        const transitInfo = getTransitToNext(startHotel);
                        const noteParts = [];
                        if (transitInfo) noteParts.push(`이동 약 ${transitInfo.duration}`);
                        else noteParts.push('일정 시작');
                        tableRows.push({
                            time: '09:00',
                            type: '[출발 숙소]',
                            name: startHotel.name,
                            note: noteParts.join(' | '),
                            isHotel: true,
                            isBold: true
                        });
                    }

                    if (dayItems.length === 0 && !flightArrival && !startHotel && !endHotel && !flightDeparture) {
                        tableRows.push({
                            time: '-',
                            type: '[자유 일정]',
                            name: '등록된 일정이 없습니다 (자유 여행)',
                            note: '-',
                            isBold: false
                        });
                    } else {
                        dayItems.forEach((item, idx) => {
                            const mealLabel = item.mealType && MEAL_META[item.mealType]
                                ? `[식사 · ${MEAL_META[item.mealType].label}]`
                                : '[관광]';
                            const transitInfo = getTransitToNext(item);
                            const noteParts = [];
                            if (transitInfo) noteParts.push(`이동 약 ${transitInfo.duration}`);
                            if (item.memo) {
                                const cleanM = cleanPdfText(item.memo);
                                const excerpt = cleanM.length > 20 ? cleanM.substring(0, 18) + '...' : cleanM;
                                noteParts.push(excerpt);
                            }
                            tableRows.push({
                                time: item.time || '-',
                                type: mealLabel,
                                name: `${idx + 1}. ${item.name}`,
                                note: noteParts.join(' | ') || '-',
                                isMeal: !!item.mealType,
                                isBold: false
                            });
                        });
                    }

                    if (endHotel) {
                        tableRows.push({
                            time: '복귀',
                            type: '[복귀 숙소]',
                            name: endHotel.name,
                            note: '체크인 및 휴식',
                            isHotel: true,
                            isBold: true
                        });
                    }

                    if (flightDeparture) {
                        tableRows.push({
                            time: flightDeparture.dep.time || '출발',
                            type: '[항공 · 출발]',
                            name: `${flightDeparture.flightNo} (${flightDeparture.dep.iata || flightDeparture.dep.name || '?'} → ${flightDeparture.arr.iata || flightDeparture.arr.name || '?'})`,
                            note: flightDeparture.airline || '공항 이동 및 출국',
                            isFlight: true,
                            isBold: true
                        });
                    }

                    // Render Section 1: Timeline Table
                    drawSectionHeader('1. 타임라인 전체 일정 요약 (Timeline Summary Table)');
                    drawTableHeader();
                    tableRows.forEach((row, rIdx) => {
                        drawTableRow(row, rIdx % 2 === 1);
                    });
                    y += 5.0;

                    // 2. Build Detail Cards for Section 2
                    const detailCards = [];
                    if (startHotel && (startHotel.address || startHotel.name)) {
                        const transitInfo = getTransitToNext(startHotel);
                        detailCards.push({
                            name: `출발 숙소 : ${startHotel.name}`,
                            tag: '숙소 / 출발',
                            time: '09:00',
                            address: startHotel.address,
                            memo: '',
                            transit: transitInfo ? `다음 장소(${cleanPdfText(transitInfo.nextName)})까지 대중교통 약 ${transitInfo.duration} 소요` : '',
                            accentColor: C_BLUE
                        });
                    }

                    dayItems.forEach((item, idx) => {
                        const transitInfo = getTransitToNext(item);
                        const tag = item.mealType && MEAL_META[item.mealType]
                            ? `식사 · ${MEAL_META[item.mealType].label}`
                            : '관광 / 일정';
                        detailCards.push({
                            name: `${idx + 1}. ${item.name}`,
                            tag: tag,
                            time: item.time ? `예정 ${item.time}` : '',
                            address: item.address,
                            memo: item.memo,
                            transit: transitInfo ? `다음 장소(${cleanPdfText(transitInfo.nextName)})까지 대중교통 약 ${transitInfo.duration} 소요` : '',
                            accentColor: item.mealType ? [180, 83, 9] : C_NAVY
                        });
                    });

                    if (endHotel && (endHotel.address || endHotel.name)) {
                        detailCards.push({
                            name: `복귀 숙소 : ${endHotel.name}`,
                            tag: '숙소 / 휴식',
                            time: '복귀',
                            address: endHotel.address,
                            memo: '',
                            transit: '',
                            accentColor: C_BLUE
                        });
                    }

                    // Render Section 2: Place Details
                    drawSectionHeader('2. 장소별 상세 안내 & 메모 (Place Details & Guide)');
                    if (detailCards.length === 0) {
                        ensureSpace(10);
                        pdf.setFontSize(8.5);
                        pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                        pdf.text('(이 날짜에는 등록된 상세 장소가 없습니다 - 자유 일정)', marginL + 4, y + 4);
                        y += 8.0;
                    } else {
                        detailCards.forEach(card => {
                            drawPlaceDetailCard(card);
                        });
                    }
                    y += 3.0;

                    // 3. Render Section 3: Expenses (if any)
                    if (dayExpenses.length > 0) {
                        drawSectionHeader('3. 일자별 지출 경비 요약 (Daily Expenses)');
                        const sum = dayExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);

                        ensureSpace(16);
                        pdf.setFillColor(C_SEC_BG[0], C_SEC_BG[1], C_SEC_BG[2]);
                        pdf.rect(marginL, y, usableW, 6.5, 'F');
                        pdf.setFontSize(8);
                        pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                        pdf.text('지출 항목 / 내용', marginL + 4, y + 4.4);
                        pdf.text('금액', pageW - marginR - 4, y + 4.4, { align: 'right' });
                        y += 6.5;

                        dayExpenses.forEach((e, eIdx) => {
                            const rowH = 6.2;
                            ensureSpace(rowH);
                            if (eIdx % 2 === 1) {
                                pdf.setFillColor(C_BG_ALT[0], C_BG_ALT[1], C_BG_ALT[2]);
                                pdf.rect(marginL, y, usableW, rowH, 'F');
                            }
                            pdf.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
                            pdf.setLineWidth(0.15);
                            pdf.line(marginL, y + rowH, pageW - marginR, y + rowH);

                            pdf.setFontSize(8.2);
                            pdf.setTextColor(C_TEXT[0], C_TEXT[1], C_TEXT[2]);
                            pdf.text(cleanPdfText(e.desc || '-'), marginL + 4, y + 4.3);
                            pdf.text(cleanPdfText(formatMoney(e.amount)), pageW - marginR - 4, y + 4.3, { align: 'right' });
                            y += rowH;
                        });

                        // Total Row
                        const totalH = 7.5;
                        ensureSpace(totalH);
                        pdf.setFillColor(C_SEC_BG[0], C_SEC_BG[1], C_SEC_BG[2]);
                        pdf.rect(marginL, y, usableW, totalH, 'F');
                        pdf.setFontSize(9);
                        pdf.setTextColor(C_NAVY[0], C_NAVY[1], C_NAVY[2]);
                        pdf.text('지출 합계', marginL + 4, y + 5.0);
                        pdf.text('지출 합계', marginL + 4.1, y + 5.0);

                        const sumText = cleanPdfText(formatMoney(sum));
                        pdf.text(sumText, pageW - marginR - 4, y + 5.0, { align: 'right' });
                        pdf.text(sumText, pageW - marginR - 4.1, y + 5.0, { align: 'right' });
                        y += totalH + 4.0;
                    }
                });

                // Running Footer across all pages
                const totalPages = pdf.getNumberOfPages();
                for (let p = 1; p <= totalPages; p++) {
                    pdf.setPage(p);
                    pdf.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
                    pdf.setLineWidth(0.2);
                    pdf.line(marginL, pageH - 10, pageW - marginR, pageH - 10);

                    pdf.setFontSize(8);
                    pdf.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
                    pdf.text(`Triptic 여행 플래너 · ${cleanPdfText(tripCity) || '여행'} 일정표`, marginL, pageH - 6);
                    pdf.text(`${p} / ${totalPages} 페이지`, pageW - marginR, pageH - 6, { align: 'right' });
                }

                const filename = exportMode === 'all'
                    ? `여행일정표_${cleanPdfText(tripCity) || '여행'}_전체일정.pdf`
                    : `여행일정표_${cleanPdfText(tripCity) || '여행'}_${currentDay}일차.pdf`;

                pdf.save(filename);
                showToast('🎉 PDF 일정표가 성공적으로 다운로드되었습니다!');
            } catch (err) {
                console.error(err);
                showToast('PDF 생성 중 오류가 발생했습니다.', { type: 'error' });
            }
        }
    </script>
</body>
</html>
