<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Triptic - 감성 여행 플래너</title>
    
    <!-- 📱 PWA 매니페스트 & 테마 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F9F9F7">
    <meta name="description" content="차분하고 직관적인 여행 일정 플래너, Triptic">
    
    <!-- 🍎 iOS Safari & Native App 지원 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Triptic">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <!-- 🔤 프리텐다드 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    
    <!-- 📦 외부 라이브러리 (버전 고정) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 🔑 환경 변수 로더 (Vercel / Local) -->
    <script>
        window.ENV = window.ENV || null;
        window.__envPromise = (async function() {
            try {
                const res = await fetch('/api/env');
                if (res.ok) {
                    const data = await res.json();
                    if (data && (data.GOOGLE_MAPS_API_KEY || data.SUPABASE_URL)) {
                        window.ENV = data;
                        return data;
                    }
                }
            } catch (e) {}

            try {
                const isNativeApp = window.location.protocol === 'capacitor:' ||
                                  window.location.hostname === 'localhost' ||
                                  window.location.protocol === 'file:';
                if (isNativeApp) {
                    const remoteRes = await fetch('https://triptic-ten.vercel.app/api/env');
                    if (remoteRes.ok) {
                        const data = await remoteRes.json();
                        window.ENV = data;
                        return data;
                    }
                }
            } catch (e) {
                console.warn('⚠️ 환경 변수 로드 실패:', e);
            }

            return window.ENV || {};
        })();
    </script>

    <style>
        /* ==========================================================================
           🎨 차분하고 편안한 웜 베이지 디자인 시스템 (Warm Minimalist Beige)
           ========================================================================== */
        :root {
            --bg-page: #F9F9F7;          /* 맑고 편안한 웜 오프화이트/린넨 */
            --bg-surface: #F3F4F1;       /* 사이드바 / 서브 서피스 */
            --bg-card: #FFFFFF;          /* 순백 카드 */
            --bg-input: #FFFFFF;         /* 인풋 배경 */
            --bg-subtle: #E9ECE8;        /* 미세한 칩/태그 배경 */
            --bg-hover: #DEE3DC;         /* 호버 배경 */
            
            /* 고대비 딥 네이비 & 차콜 잉크 (가독성 100% 확보) */
            --text-title: #0F172A;       /* 딥 미드나잇 네이비 (선명한 헤드라인) */
            --text-body: #1E293B;        /* 딥 슬레이트 (선명한 본문) */
            --text-muted: #475569;       /* 또렷한 보조 설명 */
            --text-light: #94A3B8;       /* 은은한 플레이스홀더 */
            
            --border-color: #E2E8F0;     /* 깔끔한 슬레이트 보더 */
            --border-subtle: #EDF2F7;    /* 미세 보더 */
            --border-focus: #1E3A5F;     /* 포커스 딥 네이비 */
            
            /* 딥 오션 마린 네이비 액센트 */
            --brand-primary: #1E3A5F;    /* 메인 딥 오션 네이비 */
            --brand-hover: #142842;      /* 딥 네이비 호버 */
            --brand-light: #EDF3F8;      /* 노르딕 아이스 블루 틴트 */
            
            --accent-slate: #2563EB;     /* 대중교통 경로 (시원하고 명확한 블루) */
            --accent-slate-light: #EFF6FF;
            
            --success: #166534;          /* 딥 포레스트 그린 */
            --success-light: #DCFCE7;
            
            --warning: #9A3412;          /* 테라코타 앰버 */
            --warning-light: #FFEDD5;
            
            --danger: #991B1B;           /* 딥 브릭 레드 */
            --danger-light: #FEE2E2;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-pill: 9999px;
            
            --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
            --shadow-hover: 0 4px 14px rgba(15, 23, 42, 0.08);
            --shadow-modal: 0 20px 38px -4px rgba(15, 23, 42, 0.18), 0 6px 14px -2px rgba(15, 23, 42, 0.08);
            
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all;
            letter-spacing: -0.2px;
        }

        html {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            background: var(--bg-page);
            color: var(--text-body);
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        button, input, textarea, select {
            touch-action: manipulation;
        }

        /* ⚡ 스플래시 화면 */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--bg-page);
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #splash-screen .splash-logo {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            object-fit: cover;
        }
        #splash-screen .splash-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.5px;
        }
        #splash-screen .splash-credit {
            position: absolute;
            bottom: 24px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ==========================================================================
           🏠 로비(메인) 화면 - PC 대시보드 & 모바일 카드 피드
           ========================================================================== */
        #lobby-screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-page);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px 16px 40px;
            overflow-y: auto;
        }
        .lobby-container {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 80px);
        }
        .lobby-header {
            margin: 16px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .lobby-brand-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .triptic-logo-mark {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            user-select: none;
        }
        .triptic-logo-glyph {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 8px rgba(37, 99, 235, 0.22));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .triptic-logo-mark:hover .triptic-logo-glyph {
            transform: translateY(-2px) scale(1.06);
        }
        .triptic-logo-text {
            color: var(--text-title);
            margin: 0;
            font-size: 32px;
            font-weight: 850;
            letter-spacing: -0.035em;
            line-height: 1;
            font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Inter', system-ui, sans-serif;
        }
        .triptic-logo-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563EB, #38BDF8);
            margin-left: -6px;
            margin-top: 14px;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.45);
            flex-shrink: 0;
        }
        .lobby-brand-subtitle {
            color: var(--text-muted);
            margin: 2px 0 0 0;
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .new-project-btn {
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 48px;
            width: 100%;
            transition: background var(--transition-fast), transform var(--transition-fast);
        }
        .new-project-btn:hover {
            background: var(--brand-hover);
        }
        .new-project-btn:active {
            transform: scale(0.98);
        }

        /* 🗂️ 여행 카드 리스트 (PC 그리드 & 모바일 스택) */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        .project-list.empty-state-container {
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100% !important;
            min-height: 260px !important;
            text-align: center !important;
            grid-column: 1 / -1 !important;
            margin: 40px auto 30px !important;
        }
        .lobby-empty-notice {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 44px 32px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }
        .lobby-empty-notice .empty-icon {
            font-size: 38px;
            margin-bottom: 14px;
            opacity: 0.85;
        }
        .lobby-empty-notice .empty-title {
            font-size: 16.5px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .lobby-empty-notice .empty-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ☁️ 로비 하단 텍스트 버튼 (기기 동기화 & 백업) */
        .lobby-footer {
            margin-top: auto;
            padding: 28px 0 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        .lobby-footer-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            transition: all var(--transition-fast);
            text-decoration: none;
            font-family: inherit;
        }
        .lobby-footer-btn:hover {
            color: var(--brand-primary);
            background: rgba(30, 58, 95, 0.06);
        }
        .lobby-footer-btn:active {
            transform: scale(0.98);
        }
        .lobby-footer-btn .footer-btn-icon {
            font-size: 14px;
            opacity: 0.85;
        }

        /* ☁️ 기기 동기화 & 백업 팝업 모달 */
        .sync-modal-wrap {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }
        .sync-modal-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .sync-modal-header h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sync-modal-desc {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.45;
        }
        .sync-modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 13px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sync-card-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sync-code-display-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            gap: 10px;
        }
        .sync-code-val {
            font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
            font-weight: 800;
            color: var(--brand-primary);
            letter-spacing: 1.2px;
        }
        .sync-code-copy-btn {
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity var(--transition-fast);
            white-space: nowrap;
        }
        .sync-code-copy-btn:hover {
            opacity: 0.9;
        }
        .sync-card-tip {
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .sync-modal-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 480px) {
            .sync-modal-btn-grid {
                grid-template-columns: 1fr;
            }
        }
        .sync-modal-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-align: left;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        .sync-modal-btn:hover {
            border-color: var(--brand-primary);
            box-shadow: 0 2px 8px rgba(30, 58, 95, 0.08);
            background: #ffffff;
        }
        .sync-btn-icon {
            font-size: 18px;
            flex-shrink: 0;
        }
        .sync-btn-label {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        .sync-btn-title {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-title);
        }
        .sync-btn-desc {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .project-card {
            background: var(--bg-card);
            padding: 20px 22px;
            border-radius: var(--radius-md);
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 14px;
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
            box-sizing: border-box;
            height: auto;
            position: relative;
        }
        .project-card:hover {
            box-shadow: 0 8px 24px rgba(30, 58, 95, 0.12);
            border-color: var(--brand-primary);
            transform: translateY(-2px);
        }
        .project-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .project-card-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--brand-light);
            color: var(--brand-primary);
            font-size: 11.5px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            letter-spacing: -0.2px;
        }
        .project-card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .clone-project-btn, .delete-project-btn {
            background: var(--bg-surface);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 5px 11px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 11.5px;
            cursor: pointer;
            transition: all var(--transition-fast);
            line-height: 1.3;
            font-family: inherit;
        }
        .clone-project-btn:hover {
            background: var(--bg-hover);
            color: var(--text-title);
        }
        .delete-project-btn {
            color: var(--danger);
        }
        .delete-project-btn:hover {
            background: #FEE2E2;
            border-color: #FCA5A5;
            color: #B91C1C;
        }
        .project-card-main {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .project-card-title {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.4px;
            line-height: 1.3;
            word-break: break-word;
            transition: color var(--transition-fast);
        }
        .project-card:hover .project-card-title {
            color: var(--brand-primary);
        }
        .project-card-dates {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .project-duration-tag {
            background: var(--bg-subtle);
            color: var(--brand-primary);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(30, 58, 95, 0.1);
        }
        .project-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            margin-top: 2px;
        }
        .project-card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .project-places-badge {
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }
        .project-updated-time {
            color: var(--text-muted);
            font-size: 11px;
        }
        .project-open-link {
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-primary);
            display: inline-flex;
            align-items: center;
            transition: transform var(--transition-fast);
        }
        .project-card:hover .project-open-link {
            transform: translateX(3px);
        }

        /* ==========================================================================
           🗺️ 플래너(앱) 화면 - PC 2열 분할 & 모바일 최적화
           ========================================================================== */
        #app-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* 📱 모바일 기본 (일정 목록 모드): 지도는 숨겨지고 사이드바가 100% 전면 활용 */
        #map {
            display: none;
            width: 100%;
            height: 100%;
            height: 100dvh;
            flex: 1;
            z-index: 1;
        }
        #sidebar {
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            flex: 1;
            overflow-y: auto;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(88px + env(safe-area-inset-bottom, 0px));
            background: var(--bg-surface);
            z-index: 2;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        /* 📱 모바일 지도 모드 활성화 시 (#app-screen.mobile-map-active) */
        #app-screen.mobile-map-active #map {
            display: block;
        }
        #app-screen.mobile-map-active #sidebar {
            display: none;
        }

        /* 📱 모바일 플로팅 뷰 전환 알약 버튼 (Airbnb / Triple 스타일) */
        .mobile-view-toggle-btn {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #1E293B;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 9999px;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.2px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28), 0 2px 8px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .mobile-view-toggle-btn:active {
            transform: translateX(-50%) scale(0.95);
            background: #0F172A;
        }
        .mobile-view-toggle-btn .toggle-icon {
            font-size: 16px;
            line-height: 1;
        }
        .mobile-view-toggle-btn .toggle-text {
            font-size: 13.5px;
            line-height: 1;
            white-space: nowrap;
        }

        /* 📱 모바일 지도 상단 플로팅 칩 */
        .mobile-map-header-chip {
            display: none;
        }
        #app-screen.mobile-map-active .mobile-map-header-chip {
            display: inline-flex;
            position: fixed;
            top: calc(16px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 900;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-title);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 768px) {
            .planner-top-bar {
                gap: 5px;
                margin-bottom: 8px;
            }
            .top-nav-btn {
                padding: 6px 8px;
                font-size: 12px;
                min-height: 34px;
                white-space: nowrap;
            }
            .top-action-group {
                gap: 4px;
            }
            .icon-btn {
                padding: 6px 7px;
                font-size: 11.5px;
                min-height: 34px;
                white-space: nowrap;
            }
            .trip-info-bar {
                padding: 8px 12px;
                margin-bottom: 8px;
            }
            .trip-info-text {
                font-size: 12px;
                line-height: 1.4;
            }
            .trip-info-text .city-name {
                font-size: 14.5px;
            }
            .mode-toggle {
                margin-bottom: 8px;
                padding: 3px;
            }
            .mode-btn {
                padding: 6px 10px;
                font-size: 12px;
                min-height: 32px;
            }
            .day-tabs {
                margin-bottom: 8px;
            }
            .input-section {
                margin-bottom: 8px;
            }
            .extra-actions {
                margin-bottom: 10px;
            }
            .place-item {
                padding: 12px 14px;
            }
            .place-header {
                gap: 4px;
                margin-bottom: 8px;
            }
            .header-left {
                gap: 2px;
            }
            .action-group {
                gap: 3px;
            }
            .ai-recommend-btn {
                padding: 0 6px;
                font-size: 11px;
            }
            .move-day-btn {
                padding: 0 5px;
                font-size: 11px;
            }
            .delete-btn {
                padding: 0 6px;
                font-size: 11px;
            }
            .time-select {
                font-size: 16px !important;
                padding: 0 2px;
                line-height: 26px;
            }

            /* 🚫 iOS 사파리 인풋 포커스 시 화면 자동 확대(Auto-zoom) 원천 차단 */
            input[type="text"],
            input[type="number"],
            input[type="date"],
            input[type="time"],
            input[type="search"],
            input[type="password"],
            input[type="email"],
            textarea,
            select {
                font-size: 16px !important;
            }
        }

        /* 🔝 상단 네비게이션 툴바 */
        .planner-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .planner-top-bar::-webkit-scrollbar {
            display: none;
        }
        .top-nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-title);
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 38px;
            box-shadow: var(--shadow-card);
            transition: background var(--transition-fast);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .top-nav-btn:hover {
            background: var(--bg-subtle);
        }
        .top-action-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: nowrap;
        }
        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-body);
            padding: 7px 11px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            box-shadow: var(--shadow-card);
            transition: background var(--transition-fast);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: var(--bg-subtle);
        }
        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: var(--radius-pill);
        }

        /* 📍 여행 정보 바 & 수정 */
        .trip-info-bar {
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .trip-info-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 500;
        }
        .trip-info-text .city-name {
            color: var(--brand-primary);
            font-size: 16px;
            font-weight: 800;
        }
        .trip-edit-btn {
            background: var(--bg-subtle);
            color: var(--text-title);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-height: 34px;
            transition: background var(--transition-fast);
        }
        .trip-edit-btn:hover {
            background: var(--bg-hover);
        }

        /* 🔄 모드 세그먼트 컨트롤 */
        .mode-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: var(--bg-subtle);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition-fast);
            min-height: 36px;
        }
        .mode-btn.active {
            background: var(--bg-card);
            color: var(--brand-primary);
            box-shadow: var(--shadow-card);
        }

        #sidebar.view-mode .edit-only { display: none !important; }
        #sidebar.edit-mode .view-only { display: none !important; }

        /* 📅 일차별 탭 목록 */
        .day-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
            overflow-y: hidden !important;
            padding: 4px 4px 10px 4px;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-shrink: 0;
            box-sizing: border-box;
            min-height: 54px;
            height: 54px;
            -webkit-overflow-scrolling: touch;
        }
        .day-tabs::-webkit-scrollbar {
            display: none;
        }
        .day-tab {
            flex-shrink: 0;
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            border-radius: var(--radius-pill);
            font-weight: 700;
            color: var(--text-muted);
            font-size: 13px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            height: 38px;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition-fast);
            box-sizing: border-box;
        }
        .day-tab:hover {
            background: var(--bg-subtle);
        }
        .day-tab.active {
            background: var(--brand-primary);
            color: #ffffff;
            border-color: var(--brand-primary);
        }
        .day-tab-count {
            background: rgba(0, 0, 0, 0.07);
            padding: 2px 6px;
            border-radius: var(--radius-pill);
            font-size: 11px;
        }
        .day-tab.active .day-tab-count {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        /* 🔍 장소 검색 섹션 */
        .input-section {
            background: var(--bg-card);
            padding: 8px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
        }
        .input-group {
            display: flex;
            width: 100%;
        }
        .input-group input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
            outline: none;
            font-size: 16px;
            background: var(--bg-input);
            color: var(--text-title);
        }
        .input-group input[type="text"]:focus {
            border-color: var(--border-focus);
        }
        #add-btn {
            padding: 10px 18px;
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            min-height: 42px;
            transition: background var(--transition-fast);
        }
        #add-btn:hover {
            background: var(--brand-hover);
        }

        /* 🏨 숙소 / 식사 / 경비 액션 버튼 */
        .extra-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .extra-btn {
            flex: 1;
            padding: 9px 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-body);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 40px;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-fast);
        }
        .extra-btn:hover {
            background: var(--bg-subtle);
        }
        .extra-btn.has-data {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: var(--brand-light);
        }

        /* 📂 접이식 섹션 */
        .collapsible-section {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: none;
        }
        .collapsible-section.open { display: block; }
        .collapsible-title {
            padding: 12px 16px;
            font-weight: 800;
            font-size: 13px;
            color: var(--text-title);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-section-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .collapsible-content { padding: 14px 16px; }

        .hotel-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .hotel-row input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 16px;
            background: var(--bg-input);
            color: var(--text-title);
            outline: none;
        }
        .hotel-row input:focus { border-color: var(--border-focus); }
        .hotel-clear-btn {
            background: var(--bg-subtle);
            color: var(--danger);
            border: 1px solid var(--border-color);
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-height: 40px;
        }
        .hotel-clear-btn:hover {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        .meal-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .meal-row:last-child { margin-bottom: 0; }
        .meal-label {
            width: 50px;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-body);
            flex-shrink: 0;
        }
        .meal-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-title);
            border-radius: var(--radius-sm);
            font-size: 16px;
            outline: none;
        }
        .meal-input:focus { border-color: var(--border-focus); }
        .meal-skip-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            min-height: 40px;
            padding: 0 4px;
        }

        .expense-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .expense-desc {
            flex: 2;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-title);
            border-radius: var(--radius-sm);
            font-size: 16px;
            outline: none;
        }
        .expense-desc:focus { border-color: var(--border-focus); }
        .expense-amount {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-title);
            border-radius: var(--radius-sm);
            font-size: 16px;
            outline: none;
        }
        .expense-amount:focus { border-color: var(--border-focus); }
        .expense-add-btn {
            background: var(--brand-primary);
            color: #fff;
            border: none;
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            min-height: 40px;
        }
        .expense-add-btn:hover { background: var(--brand-hover); }
        .expense-list { margin-top: 10px; }
        .expense-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 14px;
        }
        .expense-list-item .exp-desc { color: var(--text-title); font-weight: 500; }
        .expense-list-item .exp-amount { color: var(--brand-primary); font-weight: 800; }
        .expense-del {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 13px;
            cursor: pointer;
            font-weight: 700;
            padding: 6px;
        }
        .expense-day-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            padding-top: 10px;
            margin-top: 6px;
            color: var(--text-title);
            font-size: 14px;
        }
        .expense-grand-total {
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            color: var(--brand-primary);
            font-size: 15px;
        }

        /* ==========================================================================
           📇 카드형 일정 리스트 (손톱 때 스타일 전면 제거, 정갈한 번호 뱃지 적용)
           ========================================================================== */
        #planner-list-container { min-height: 50px; }

        .place-item {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            /* 🚫 손톱 때 같은 두꺼운 border-left 제거 */
            position: relative;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
        }
        .place-item:hover {
            box-shadow: var(--shadow-hover);
            border-color: #D4CDBF;
        }
        .place-item.sortable-ghost {
            opacity: 0.4;
            border: 2px dashed var(--brand-primary);
        }

        /* 정갈한 장소 번호 뱃지 */
        .place-index-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--brand-light);
            color: var(--brand-primary);
            font-size: 11px;
            font-weight: 800;
            margin-right: 3px;
            flex-shrink: 0;
            vertical-align: middle;
        }

        .fixed-item {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-title);
            box-shadow: var(--shadow-card);
        }
        .fixed-item.flight-item {
            background: #F4EFEB;
            border-color: #DFD5CA;
        }
        .fixed-item .fi-label {
            font-weight: 800;
            color: var(--brand-primary);
            margin-right: 6px;
        }
        .fixed-item .fi-addr {
            color: var(--text-muted);
            font-size: 12px;
            display: block;
            margin-top: 3px;
        }

        .flight-preview {
            font-size: 13px;
            color: var(--success);
            margin-top: 6px;
            min-height: 16px;
            font-weight: 600;
        }
        .flight-lookup-btn {
            background: var(--bg-subtle);
            color: var(--brand-primary);
            border: 1px solid var(--border-color);
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-height: 40px;
        }
        .flight-lookup-btn:hover {
            background: var(--bg-hover);
        }

        .flight-manual-toggle {
            font-size: 12px;
            color: var(--brand-primary);
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 8px;
            padding: 4px 0;
            font-weight: 700;
            display: inline-block;
        }
        .flight-manual-fields {
            display: none;
            margin-top: 10px;
            padding: 14px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }
        .flight-manual-fields.open { display: block; }
        .flight-manual-fields .modal-field { margin-bottom: 10px; }
        .manual-flight-save-btn {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            margin-top: 4px;
        }

        /* 드래그 핸들 & 순서 버튼 */
        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-light);
            cursor: grab;
            width: 18px;
            height: 28px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            touch-action: none;
        }
        .drag-handle:active {
            cursor: grabbing;
            color: var(--brand-primary);
            background: var(--bg-subtle);
        }

        .order-btns {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .order-btn {
            width: 20px;
            height: 13px;
            border: 1px solid var(--border-color);
            background: var(--bg-subtle);
            color: var(--text-body);
            border-radius: 3px;
            font-size: 8px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .order-btn:disabled {
            opacity: 0.25;
            cursor: default;
        }
        .order-btn:not(:disabled):hover {
            background: var(--bg-hover);
        }

        .place-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .place-header::-webkit-scrollbar {
            display: none;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
            flex-wrap: nowrap;
            flex: 1;
            justify-content: space-between;
        }

        .time-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .time-select {
            padding: 2px 4px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-weight: 700;
            color: var(--brand-primary);
            font-size: 12px;
            background: var(--bg-subtle);
            outline: none;
            text-align: center;
            height: 28px;
            min-height: 28px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .time-colon {
            font-weight: 800;
            color: var(--brand-primary);
            font-size: 12px;
            user-select: none;
        }
        .time-text {
            font-weight: 800;
            color: var(--brand-primary);
            font-size: 13px;
            white-space: nowrap;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .delete-btn {
            background: var(--bg-subtle);
            color: var(--danger);
            border: 1px solid var(--border-color);
            padding: 0 8px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 11.5px;
            cursor: pointer;
            height: 28px;
            min-height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            box-sizing: border-box;
            transition: all var(--transition-fast);
        }
        .delete-btn:hover {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        .move-day-btn {
            background: var(--bg-subtle);
            color: var(--text-body);
            border: 1px solid var(--border-color);
            padding: 0 8px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 11.5px;
            cursor: pointer;
            height: 28px;
            min-height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            gap: 3px;
            box-sizing: border-box;
            transition: all var(--transition-fast);
        }
        .move-day-btn:hover {
            background: var(--bg-hover);
        }

        .ai-recommend-btn {
            background: linear-gradient(135deg, rgba(30, 58, 95, 0.08), rgba(37, 99, 235, 0.12));
            color: var(--brand-primary);
            border: 1px solid rgba(37, 99, 235, 0.25);
            padding: 0 8px;
            border-radius: var(--radius-sm);
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 28px;
            min-height: 28px;
            transition: all var(--transition-fast);
            white-space: nowrap;
            font-family: inherit;
            box-sizing: border-box;
        }
        .ai-recommend-btn:hover {
            background: var(--brand-primary);
            color: #ffffff;
            border-color: var(--brand-primary);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
            transform: translateY(-1px);
        }

        /* ✨ AI 추천 모달 및 카드 스타일 */
        .ai-rec-modal {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 82vh;
            text-align: left;
        }
        .ai-rec-header h3 {
            margin: 0 0 4px 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-rec-header p {
            margin: 0;
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .ai-rec-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .ai-rec-tab {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        .ai-rec-tab:hover {
            border-color: var(--brand-primary);
            color: var(--text-title);
        }
        .ai-rec-tab.active {
            background: var(--brand-primary);
            color: #ffffff;
            border-color: var(--brand-primary);
        }
        .ai-rec-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 52vh;
            padding-right: 4px;
        }
        .ai-rec-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
            transition: all var(--transition-fast);
        }
        .ai-rec-card:hover {
            border-color: var(--brand-primary);
            box-shadow: 0 4px 14px rgba(30, 58, 95, 0.08);
        }
        .ai-rec-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-rec-cat-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            background: var(--bg-surface);
            color: var(--text-secondary);
        }
        .ai-rec-cat-badge.restaurant { background: #FEF3C7; color: #92400E; }
        .ai-rec-cat-badge.cafe { background: #EDE9FE; color: #5B21B6; }
        .ai-rec-cat-badge.hotel { background: #DBEAFE; color: #1E40AF; }
        .ai-rec-cat-badge.spot { background: #DCFCE7; color: #166534; }
        .ai-rec-dist {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--brand-primary);
        }
        .ai-rec-card-name-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        .ai-rec-name {
            margin: 0;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-title);
            line-height: 1.3;
        }
        .ai-rec-rating {
            font-size: 12px;
            color: var(--text-title);
            white-space: nowrap;
            background: var(--bg-surface);
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }
        .rating-source {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: normal;
        }
        .ai-rec-menu-tag {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 5px 9px;
            border-radius: var(--radius-sm);
            display: inline-block;
            width: fit-content;
        }
        .menu-label { font-weight: 700; color: var(--text-title); margin-right: 4px; }
        .ai-rec-desc {
            margin: 0;
            font-size: 12.5px;
            color: var(--text-body);
            line-height: 1.5;
        }
        .ai-rec-tip {
            font-size: 11.5px;
            color: #065F46;
            background: #ECFDF5;
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: flex-start;
            gap: 6px;
            line-height: 1.4;
            border: 1px solid #A7F3D0;
        }
        .ai-rec-card-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        .ai-rec-link-btn {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            transition: background var(--transition-fast);
        }
        .ai-rec-link-btn:hover {
            background: var(--bg-surface);
            color: var(--brand-primary);
        }
        .ai-rec-add-btn {
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        .ai-rec-add-btn:hover {
            background: #152B47;
            transform: translateY(-1px);
        }
        .ai-rec-add-btn.added {
            background: #10B981;
            cursor: default;
            transform: none;
        }
        .ai-rec-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 16px;
            text-align: center;
            gap: 12px;
        }
        .ai-sparkle-spin {
            font-size: 32px;
            animation: pulseSparkle 1.4s ease-in-out infinite alternate;
        }
        @keyframes pulseSparkle {
            0% { transform: scale(0.9) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.15) rotate(15deg); opacity: 1; filter: drop-shadow(0 0 10px #2563EB); }
        }
        .ai-loading-title {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-title);
        }
        .ai-loading-sub {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }
        .ai-rec-skeleton {
            width: 100%;
            height: 90px;
            border-radius: var(--radius-md);
            background: linear-gradient(90deg, var(--bg-surface) 25%, #E2E8F0 50%, var(--bg-surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .meal-tag {
            display: inline-block;
            background: var(--warning-light);
            color: var(--warning);
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            margin-right: 6px;
            vertical-align: middle;
        }

        .place-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-title);
            margin-bottom: 4px;
            display: block;
        }
        .place-address {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .memo-input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            font-size: 16px;
            background: var(--bg-page);
            color: var(--text-title);
            resize: none;
            outline: none;
            margin-top: 4px;
        }
        .memo-input:focus {
            border-color: var(--border-focus);
            background: #ffffff;
        }
        .memo-text {
            font-size: 13px;
            color: var(--text-body);
            background: var(--bg-page);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border-left: 2px solid var(--brand-primary);
            margin-top: 6px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        /* 🚇 대중교통 이동 딥링크 */
        .route-link-wrapper {
            display: flex;
            justify-content: center;
            margin: 4px 0 14px 0;
        }
        .route-link-btn {
            background: var(--bg-card);
            color: var(--accent-slate);
            border: 1px solid var(--border-color);
            padding: 7px 16px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-fast);
        }
        .route-link-btn:hover {
            border-color: var(--accent-slate);
            background: var(--accent-slate-light);
        }
        .transit-duration-tag {
            background: var(--accent-slate-light);
            color: var(--accent-slate);
            padding: 2px 6px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 800;
        }

        .pdf-actions {
            display: flex;
            gap: 8px;
            margin: 16px 0 40px;
        }
        .pdf-btn {
            flex: 1;
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            min-height: 44px;
            transition: background var(--transition-fast);
        }
        .pdf-btn:hover {
            background: var(--brand-hover);
        }

        .empty-day-notice {
            text-align: center;
            padding: 36px 16px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ==========================================================================
           🔔 토스트 및 모달
           ========================================================================== */
        #toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 32px);
            max-width: 440px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: #2B2520;
            color: #F7F5F0;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-modal);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: toastSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast.error { background: #7A2828; }
        .toast.success { background: #2D5A45; }
        .toast.fade-out { animation: toastFadeOut 0.25s forwards; }
        .toast-message { flex: 1; line-height: 1.4; }
        .toast-action-btn {
            background: var(--brand-light);
            color: var(--brand-primary);
            border: none;
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-height: 32px;
        }
        .toast-close-btn {
            background: none;
            border: none;
            color: #A59C92;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            min-height: 28px;
        }
        @keyframes toastSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastFadeOut {
            from { opacity: 1; transform: translateY(0); }
            to   { opacity: 0; transform: translateY(12px); }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(43, 37, 32, 0.45);
            backdrop-filter: blur(3px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-modal);
            border: 1px solid var(--border-color);
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalPop {
            0%   { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal-box h3 {
            margin: 0 0 16px;
            color: var(--text-title);
            font-size: 18px;
            font-weight: 800;
        }
        .modal-field { margin-bottom: 14px; }
        .modal-field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .modal-field input, .modal-field select, .modal-field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-title);
            border-radius: var(--radius-sm);
            font-size: 16px;
            outline: none;
            transition: border-color var(--transition-fast);
        }
        .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
            border-color: var(--border-focus);
        }
        .modal-field .date-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 11px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast);
        }
        .modal-btn.primary {
            background: var(--brand-primary);
            color: #ffffff;
        }
        .modal-btn.primary:hover {
            background: var(--brand-hover);
        }
        .modal-btn.secondary {
            background: var(--bg-subtle);
            color: var(--text-body);
            border: 1px solid var(--border-color);
        }
        .modal-btn.secondary:hover {
            background: var(--bg-hover);
        }
        .modal-btn.danger {
            background: var(--danger);
            color: #ffffff;
        }

        .pac-container {
            z-index: 10000 !important;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-modal);
            border: 1px solid var(--border-color);
            font-family: inherit;
        }

        /* ==========================================================================
           💻 데스크톱 / PC 대화면 레이아웃 최적화 (>= 900px)
           ========================================================================== */
        @media (min-width: 900px) {
            #lobby-screen {
                padding: 40px 32px 60px;
            }
            .lobby-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 32px;
                padding-bottom: 24px;
                border-bottom: 1px solid var(--border-color);
            }
            .triptic-logo-glyph {
                width: 36px;
                height: 36px;
            }
            .triptic-logo-text {
                font-size: 38px;
            }
            .triptic-logo-dot {
                width: 8px;
                height: 8px;
                margin-top: 18px;
            }
            .lobby-brand-subtitle {
                font-size: 14.5px;
            }
            .new-project-btn {
                margin-bottom: 0;
                width: auto;
                min-width: 180px;
            }
            .project-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 360px));
                gap: 20px;
                align-content: start;
                align-items: start;
            }
            .project-list.empty-state-container {
                display: flex !important;
                grid-column: 1 / -1 !important;
                width: 100% !important;
                margin: 60px auto 40px !important;
            }

            /* 💻 플래너 PC 분할 화면 (지도 대화면 62%+, 오른쪽 일정 패널 38% 컴팩트) */
            #app-screen {
                flex-direction: row !important;
                max-width: 100vw;
                height: 100vh;
            }
            #map {
                display: block !important;
                flex: 1 !important;
                width: auto !important;
                min-width: 50% !important;
                height: 100vh !important;
                box-shadow: 1px 0 10px rgba(43, 37, 32, 0.05);
            }
            #sidebar {
                display: block !important;
                flex: 0 0 auto !important;
                width: 38% !important;
                min-width: 380px !important;
                max-width: 480px !important;
                height: 100vh !important;
                overflow-y: auto !important;
                padding: 24px 22px 40px !important;
                background: var(--bg-surface);
                border-left: 1px solid var(--border-color);
            }
            .day-tabs {
                flex-wrap: wrap !important;
                overflow-x: visible !important;
                overflow-y: visible !important;
                padding: 2px 0 6px 0 !important;
                min-height: auto !important;
                height: auto !important;
            }
            .mobile-view-toggle-btn,
            .mobile-map-header-chip {
                display: none !important;
            }
        }

        /* ==========================================================================
           🔒 인증 벽 (로그인 필수 및 배경 블러 처리)
           ========================================================================== */
        body.auth-locked #lobby-screen,
        body.auth-locked #app-screen {
            filter: blur(16px) brightness(0.96) !important;
            pointer-events: none !important;
            user-select: none !important;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }

        .auth-wall-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(249, 249, 247, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            box-sizing: border-box;
            animation: authFadeIn 0.3s ease;
        }

        @keyframes authFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .auth-wall-card {
            background: #ffffff;
            border: 1px solid var(--border-color, #E5E7EB);
            border-radius: 24px;
            padding: 38px 30px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 20px 45px rgba(10, 22, 40, 0.12), 0 4px 12px rgba(10, 22, 40, 0.06);
            text-align: center;
            box-sizing: border-box;
            animation: authCardPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes authCardPop {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .auth-logo-glyph {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .auth-brand-name {
            font-size: 26px;
            font-weight: 850;
            color: var(--text-title, #0A1628);
            letter-spacing: -0.03em;
        }

        .auth-wall-title {

    <!-- 🗺️ Google Maps API 동적 로더 (Vercel 환경 변수 연동) -->
    <script>
        window._tripticSystemStarted = false;
        window.safeInitSystem = function() {
            if (window._tripticSystemStarted) return;
            if (typeof window.initSystem === 'function') {
                window._tripticSystemStarted = true;
                window.initSystem();
            } else {
                const timer = setInterval(function() {
                    if (typeof window.initSystem === 'function') {
                        clearInterval(timer);
                        if (!window._tripticSystemStarted) {
                            window._tripticSystemStarted = true;
                            window.initSystem();
                        }
                    }
                }, 30);
                setTimeout(function() {
                    clearInterval(timer);
                    if (!window._tripticSystemStarted && typeof window.initSystem === 'function') {
                        window._tripticSystemStarted = true;
                        window.initSystem();
                    }
                }, 10000);
            }
        };

        window.onGoogleMapsInit = function() {
            window.safeInitSystem();
        };

        (async function loadGoogleMaps() {
            try {
                const env = await (window.__envPromise || Promise.resolve(window.ENV || {}));
                const apiKey = env?.GOOGLE_MAPS_API_KEY || localStorage.getItem('GOOGLE_MAPS_API_KEY') || '';

                if (!apiKey) {
                    console.error('❌ Google Maps API 키를 찾을 수 없습니다. Vercel 환경 변수(GOOGLE_MAPS_API_KEY)를 확인해 주세요.');
                    window.safeInitSystem();
                    if (typeof window.gm_authFailure === 'function') window.gm_authFailure();
                    return;
                }

                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&callback=onGoogleMapsInit`;
                script.async = true;
                script.defer = true;
                script.onerror = function() {
                    console.error('❌ Google Maps 스크립트 로드 실패');
                    window.safeInitSystem();
                    if (typeof window.gm_authFailure === 'function') window.gm_authFailure();
                };
                document.head.appendChild(script);

                // 지도 로딩 지연 시 스플래시 화면 대기 해제 세이프가드 (6초)
                setTimeout(function() {
                    if (!window._tripticSystemStarted) {
                        console.warn('⚠️ Google Maps 로드 지연으로 인해 기본 모드로 앱을 시작합니다.');
                        window.safeInitSystem();
                    }
                }, 6000);
            } catch (err) {
                console.error('Google Maps 로더 오류:', err);
                window.safeInitSystem();
            }
        })();
    </script>

                        result = await client.auth.signInWithOAuth({
                            provider: 'naver',
                            options: { redirectTo: redirectUrl }
                        });
                    } catch (e) {
                        result = await client.auth.signInWithOAuth({
                            provider: 'custom:naver',
                            options: { redirectTo: redirectUrl }
                        });
                    }
                } else {
                    result = await client.auth.signInWithOAuth({
                        provider: provider,
                        options: { redirectTo: redirectUrl }
                    });
                }

                if (result?.error) {
                    if (provider === 'naver') {
                        const customResult = await client.auth.signInWithOAuth({
                            provider: 'custom:naver',
                            options: { redirectTo: redirectUrl }
                        });
                        if (customResult?.error) throw customResult.error;
                    } else {
                        throw result.error;
                    }
                }

                console.error('로그인 오류:', err);
                alert(`로그인 중 오류가 발생했습니다: ${err.message || err}`);
