                    const ac = new google.maps.places.Autocomplete(input);
                    ac.bindTo('bounds', map);

                        const place = ac.getPlace();
                        if (!place || !place.geometry) return;
                        selectMeal(slot, {

                            address: place.formatted_address || '',
                            lat: place.geometry.location.lat(),
                            lng: place.geometry.location.lng()

        function selectMeal(slot, place) {
            if (!mealsData[currentDay]) mealsData[currentDay] = {};
            mealsData[currentDay][slot] = { ...place, skip: false };
            syncMealItemsIntoList();
            saveData();
            renderList();
            updateMarkers();
            refreshExtraButtonStates();

        }

        function toggleMealSkip(slot, checked) {
            if (!mealsData[currentDay]) mealsData[currentDay] = {};
            mealsData[currentDay][slot] = { skip: checked };
            syncMealItemsIntoList();
            saveData();
            renderMealSection();
            renderList();
            updateMarkers();
            refreshExtraButtonStates();
        }

        function syncMealItemsIntoList() {
            if (!plannerData[currentDay]) plannerData[currentDay] = [];
            const dayMeals = mealsData[currentDay] || {};

            plannerData[currentDay] = plannerData[currentDay].filter(item => !item.mealType);

            Object.keys(MEAL_META).forEach(slot => {
                const info = dayMeals[slot];
                if (info && info.name && !info.skip) {
                    const newMeal = {
                        name: info.name,
                        address: info.address || '',
                        lat: info.lat,
                        lng: info.lng,
                        time: MEAL_META[slot].time,
                        memo: '',
                        mealType: slot
                    };

                    const insertIdx = plannerData[currentDay].findIndex(item => (item.time || '00:00') > newMeal.time);
                    if (insertIdx === -1) {
                        plannerData[currentDay].push(newMeal);
                    } else {
                        plannerData[currentDay].splice(insertIdx, 0, newMeal);
                    }
                }
            });
        }

        async function fetchAirportCoords(iataCode) {
            if (!iataCode) return null;
            try {
                const url = `https://api.aviationstack.com/v1/airports?access_key=${AVIATIONSTACK_API_KEY}&iata_code=${encodeURIComponent(iataCode)}`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const json = await res.json();
                const a = json.data && json.data[0];
                if (!a) return null;
                return {
                    name: a.airport_name || iataCode,
                    lat: (a.latitude != null) ? Number(a.latitude) : null,
                    lng: (a.longitude != null) ? Number(a.longitude) : null
                };
            } catch (e) {
                return null;
            }
        }

        function extractLocalTime(scheduledStr) {
            if (!scheduledStr) return '';
            const m = scheduledStr.match(/T(\d{2}:\d{2})/);
            return m ? m[1] : '';
        }

        async function lookupFlight(flightNo, dateStr) {
            if (!flightNo || !dateStr || !AVIATIONSTACK_API_KEY) return null;

            try {
                const url = `https://api.aviationstack.com/v1/flights?access_key=${AVIATIONSTACK_API_KEY}&flight_iata=${encodeURIComponent(flightNo.trim())}&flight_date=${dateStr}`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const json = await res.json();
                if (json.error || !Array.isArray(json.data) || json.data.length === 0) return null;

                const f = json.data[0];
                const dep = f.departure || {};
                const arr = f.arrival || {};

                const [depCoords, arrCoords] = await Promise.all([
                    fetchAirportCoords(dep.iata),
                    fetchAirportCoords(arr.iata)
                ]);

                return {
                    flightNo: flightNo.trim().toUpperCase(),
                    date: dateStr,
                    dep: {
                        iata: dep.iata || '',
                        name: (depCoords && depCoords.name) || dep.airport || dep.iata || '',
                        lat: depCoords ? depCoords.lat : null,

        const ZONE_DISTANCE_THRESHOLD_KM = 20;

        function haversineKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function computeDayZones(day) {
            const list = plannerData[day] || [];
            const zones = [];
            list.forEach((item, idx) => {
                if (!item || item.lat == null || item.lng == null) return;
                if (zones.length === 0) { zones.push({ indices: [idx] }); return; }
                const lastZone = zones[zones.length - 1];
                const lastItem = list[lastZone.indices[lastZone.indices.length - 1]];
                const dist = haversineKm(lastItem.lat, lastItem.lng, item.lat, item.lng);
                if (dist > ZONE_DISTANCE_THRESHOLD_KM) zones.push({ indices: [idx] });
                else lastZone.indices.push(idx);
            });
            return zones;
        }

        function zoneCentroid(zone, list) {
            const pts = zone.indices.map(i => list[i]);
            return {
                lat: pts.reduce((s, p) => s + p.lat, 0) / pts.length,
                lng: pts.reduce((s, p) => s + p.lng, 0) / pts.length
            };
        }

        function nearestZoneIndexForPoint(zones, list, point) {
            let best = 0, bestDist = Infinity;
            zones.forEach((zone, idx) => {
                const c = zoneCentroid(zone, list);
                const d = haversineKm(c.lat, c.lng, point.lat, point.lng);
                if (d < bestDist) { bestDist = d; best = idx; }
            });
            return best;
        }

        function updateMarkers() {
            markers.forEach(m => m.setMap(null));
            markers = [];
            if (!plannerData[currentDay] || !map) return;

            const list = plannerData[currentDay];
            const dayZones = computeDayZones(currentDay);
            const multiZone = dayZones.length > 1;
            activeZoneIndex = multiZone ? dayZones.length - 1 : 0;
            const activeIndices = multiZone ? new Set(dayZones[activeZoneIndex].indices) : null;

            const bounds = new google.maps.LatLngBounds();
            let hasBoundsPoint = false;

            const { startHotel, endHotel } = getDayHotels(currentDay);
            const placedHotelKeys = new Set();

            [startHotel, endHotel].forEach(h => {
                if (!h || h.lat == null || h.lng == null) return;
                if (multiZone && nearestZoneIndexForPoint(dayZones, list, h) !== activeZoneIndex) return;
                const key = h.lat + ',' + h.lng;
                if (placedHotelKeys.has(key)) return;
                placedHotelKeys.add(key);
                const pos = { lat: h.lat, lng: h.lng };
                const hotelMarker = new google.maps.Marker({
                    map: map,
                    position: pos,
                    title: h.name,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 9,
                        fillColor: '#1E3A5F',
                        fillOpacity: 1,
                        strokeColor: '#ffffff',
                        strokeWeight: 2
                    }
                });
                markers.push(hotelMarker);
                bounds.extend(pos);
                hasBoundsPoint = true;
            });

            let shownItemCount = 0;
            list.forEach((item, index) => {
                if (!item || item.lat == null || item.lng == null) return;
                if (multiZone && !activeIndices.has(index)) return;
                shownItemCount++;
                const pos = { lat: item.lat, lng: item.lng };
                const marker = new google.maps.Marker({
                    map: map,
                    position: pos,
                    label: {
                        text: String(index + 1),
                        color: '#ffffff',
                        fontWeight: 'bold',
                        fontSize: '12px'
                    },
                    title: item.name
                });
                markers.push(marker);
                bounds.extend(pos);
                hasBoundsPoint = true;
            });

            const totalPoints = shownItemCount + placedHotelKeys.size;
            if (hasBoundsPoint && totalPoints > 1) {
                map.fitBounds(bounds);
            } else if (hasBoundsPoint) {
                map.setCenter(bounds.getCenter());
                map.setZoom(15);
            }

            handleRouteDisplay();
        }

        function clearRoutes() {
            directionsRenderers.forEach(r => r.setMap(null));
            directionsRenderers = [];
            fallbackPolylines.forEach(p => p.setMap(null));
            fallbackPolylines = [];
        }

        function handleRouteDisplay() {
            clearRoutes();
            if (currentMode === 'view') drawRoutesForViewMode();
        }

        function drawRoutesForViewMode() {
            if (!plannerData[currentDay] || !map) return;

            const dayItems = plannerData[currentDay];
            const dayZones = computeDayZones(currentDay);
            const multiZone = dayZones.length > 1;
            const activeIndices = multiZone ? new Set(dayZones[Math.min(activeZoneIndex, dayZones.length - 1)].indices) : null;

            const { startHotel, endHotel } = getDayHotels(currentDay);
            const list = [];

            if (startHotel && startHotel.lat != null && startHotel.lng != null &&
                (!multiZone || nearestZoneIndexForPoint(dayZones, dayItems, startHotel) === activeZoneIndex)) {
                list.push(startHotel);
            }
            dayItems.forEach((p, idx) => {
                if (!p || !p.lat || !p.lng) return;
                if (multiZone && !activeIndices.has(idx)) return;
                list.push(p);
            });
            if (endHotel && endHotel.lat != null && endHotel.lng != null &&
                (!multiZone || nearestZoneIndexForPoint(dayZones, dayItems, endHotel) === activeZoneIndex)) {
                list.push(endHotel);
            }

            if (list.length < 2) return;
            if (!directionsService) directionsService = new google.maps.DirectionsService();

            for (let i = 0; i < list.length - 1; i++) {
                const origin = { lat: list[i].lat, lng: list[i].lng };
                const destination = { lat: list[i + 1].lat, lng: list[i + 1].lng };
                const cacheKey = `${origin.lat.toFixed(5)},${origin.lng.toFixed(5)}->${destination.lat.toFixed(5)},${destination.lng.toFixed(5)}`;

                const renderer = new google.maps.DirectionsRenderer({
                    map: map,
                    suppressMarkers: true,
                    preserveViewport: true,
                    polylineOptions: { strokeColor: '#2563EB', strokeWeight: 4, strokeOpacity: 0.85 }
                });
                directionsRenderers.push(renderer);

                if (directionsCache.has(cacheKey)) {
                    const cached = directionsCache.get(cacheKey);
                    if (cached.status === 'OK' && cached.result) {
                        renderer.setDirections(cached.result);
                    } else {
                        drawDashedFallback(origin, destination);
                    }
                    continue;
                }

                directionsService.route(
                    { origin, destination, travelMode: google.maps.TravelMode.TRANSIT },
                    (result, status) => {
                        if (status === 'OK' && result && result.routes && result.routes[0]) {
                            renderer.setDirections(result);
                            const leg = result.routes[0].legs[0];
                            directionsCache.set(cacheKey, {
                                status: 'OK',
                                result: result,
                                duration: leg ? leg.duration.text : '',
                                distance: leg ? leg.distance.text : ''
                            });
                        } else {
                            renderer.setMap(null);
                            directionsCache.set(cacheKey, { status: 'FAILED' });
                            drawDashedFallback(origin, destination);
                        }
                    }
                );
            }
        }

        function drawDashedFallback(origin, destination) {
            const line = new google.maps.Polyline({
                path: [origin, destination],
                strokeOpacity: 0,
                icons: [{
                    icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 },
                    offset: '0',
                    repeat: '10px'
                }],
                strokeColor: '#1E3A5F',
                map: map
            });
            fallbackPolylines.push(line);
        }

        async function acceptSuggestion(id) {
            const p = (window.currentSuggestionsCache || {})[id];
            if (!p) return;
            const day = p.day || 1;

            if (!plannerData[day]) plannerData[day] = [];
            const validList = plannerData[day].filter(Boolean);
            let defaultTime = validList.length > 0 ? (validList[validList.length - 1].time || '10:00') : '10:00';

            let memo = p.proposer ? `[${p.proposer}님 추천] ` : '';
            if (p.memo) memo += p.memo;

            plannerData[day].push({
                name: p.name,
                address: p.address,
                lat: p.lat,
                lng: p.lng,
                time: defaultTime,
                memo
            });

            saveData();
            await fetch(`${FIREBASE_DB_URL}/suggestions/${activeShareId}/${id}.json`, { method: 'DELETE' }).catch(() => {});
            delete window.currentSuggestionsCache[id];
            renderSuggestionList(window.currentSuggestionsCache);
            changeDay(day);
            showToast(`'${escapeHtml(p.name)}' 장소가 ${day}일차에 추가되었습니다!`);
        }

        let cachedKoreanFontBase64 = null;

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        async function ensureKoreanFont(pdf) {
            if (!cachedKoreanFontBase64) {
                const fontUrl = 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/nanumgothic/NanumGothic-Regular.ttf';
                const res = await fetch(fontUrl);
                if (!res.ok) throw new Error('Font load failed');
                const buffer = await res.arrayBuffer();
                cachedKoreanFontBase64 = arrayBufferToBase64(buffer);
            }
            pdf.addFileToVFS('NanumGothic.ttf', cachedKoreanFontBase64);
            pdf.addFont('NanumGothic.ttf', 'NanumGothic', 'normal');
            pdf.setFont('NanumGothic', 'normal');
        }

        async function exportToPDF(exportMode = 'all') {
            closeModal();
            showToast('⏳ 고화질 PDF를 생성하고 있습니다...', { duration: 3000 });

            try {
                window.jsPDF = window.jspdf.jsPDF;
                const pdf = new jsPDF('p', 'mm', 'a4');
                await ensureKoreanFont(pdf);

                const pageW = 210, pageH = 297;
                const marginL = 16, marginR = 16, marginT = 18, marginB = 16;
                const usableW = pageW - marginL - marginR;
                const COLOR_PRIMARY = [30, 58, 95];
                const COLOR_ACCENT  = [37, 99, 235];
                const COLOR_TEXT    = [15, 23, 42];
                const COLOR_SUB     = [71, 85, 105];
                const COLOR_LINE    = [226, 232, 240];

                let y = marginT;

                function newPage() {
                    pdf.addPage();
                    y = marginT;
                }
                function ensure(need) {
                    if (y + need > pageH - marginB) newPage();
                }
                function boldText(text, x, size, color) {
                    pdf.setFontSize(size);
                    pdf.setTextColor(color[0], color[1], color[2]);
                    pdf.text(String(text), x, y);
                    pdf.text(String(text), x + 0.15, y);
                }
                function normalText(text, x, size, color) {
                    pdf.setFontSize(size);
                    pdf.setTextColor(color[0], color[1], color[2]);
                    pdf.text(String(text), x, y);
                }
                function wrappedText(text, x, size, color, maxWidth) {
                    pdf.setFontSize(size);
                    pdf.setTextColor(color[0], color[1], color[2]);
                    const lines = pdf.splitTextToSize(String(text), maxWidth);
                    ensure(lines.length * (size * 0.42) + 1);
                    pdf.text(lines, x, y);
                    y += lines.length * (size * 0.42);
                    return lines.length;
                }
                function hr() {
                    ensure(4);
                    pdf.setDrawColor(COLOR_LINE[0], COLOR_LINE[1], COLOR_LINE[2]);
                    pdf.setLineWidth(0.2);
                    pdf.line(marginL, y, pageW - marginR, y);
                    y += 4;
                }

                const targetDays = exportMode === 'all'
                    ? Array.from({ length: totalTripDays }, (_, i) => i + 1)
                    : [currentDay];

                targetDays.forEach((dayNum, loopIdx) => {
                    if (loopIdx > 0) newPage();

                    const dateObj = tripDates[dayNum];
                    const dateStr = dateObj ? dateObj.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }) : '';

                    boldText(`${tripCity || '여행'} 일정표 · ${dayNum}일차`, marginL, 16, COLOR_PRIMARY);
                    y += 6;
                    normalText(`${tripStart} ~ ${tripEnd} (총 ${totalTripDays}일 중 ${dayNum}일차)  |  ${dateStr}`, marginL, 9.5, COLOR_SUB);
                    y += 5;
                    pdf.setDrawColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
                    pdf.setLineWidth(0.6);
                    pdf.line(marginL, y, pageW - marginR, y);
                    y += 7;

                    const isFirst = dayNum === 1;
                    const isLast = dayNum === totalTripDays;
                    const { startHotel, endHotel } = getDayHotels(dayNum);
                    const flightArrival = (isFirst && flightsData.outbound) ? flightsData.outbound : null;
                    const flightDeparture = (isLast && flightsData.return) ? flightsData.return : null;
                    const dayItems = plannerData[dayNum] || [];
                    const dayExpenses = expensesData[dayNum] || [];

                    if (flightArrival) {
                        ensure(15);
                        boldText(`도착 항공편: ${flightArrival.flightNo}`, marginL, 11, COLOR_PRIMARY);
                        y += 5;
                        normalText(`${flightArrival.dep.name || flightArrival.dep.iata || '?'} → ${flightArrival.arr.name || flightArrival.arr.iata || '?'}  |  ${flightArrival.dep.time || ''} ~ ${flightArrival.arr.time || ''}`, marginL, 9.5, COLOR_TEXT);
                        y += 5;
                        hr();
                    }

                    if (startHotel) {
                        ensure(14);
                        boldText(`출발 숙소: ${startHotel.name}`, marginL, 10.5, COLOR_ACCENT);
                        y += 5;
                        if (startHotel.address) wrappedText(startHotel.address, marginL, 8.5, COLOR_SUB, usableW);
                        y += 3;
                        hr();
                    }

                    if (dayItems.length === 0) {
                        ensure(10);
                        normalText('(이 날짜는 자유 일정입니다)', marginL, 9.5, COLOR_SUB);
                        y += 8;
                    } else {
                        dayItems.forEach((item, idx) => {
                            const mealLabel = item.mealType ? `[${MEAL_META[item.mealType].label}] ` : '';
                            ensure(12);
                            boldText(`${idx + 1}. ${item.time || ''}  ${mealLabel}${item.name}`, marginL, 10, COLOR_TEXT);
                            y += 4.5;
                            if (item.address) wrappedText(item.address, marginL + 4, 8, COLOR_SUB, usableW - 4);
                            if (item.memo) wrappedText(`📝 ${item.memo}`, marginL + 4, 8, COLOR_ACCENT, usableW - 4);
                            y += 3;
                        });
                    }
                    hr();

                    if (endHotel) {
                        ensure(14);
                        boldText(`복귀 숙소: ${endHotel.name}`, marginL, 10.5, COLOR_ACCENT);
                        y += 5;
                        if (endHotel.address) wrappedText(endHotel.address, marginL, 8.5, COLOR_SUB, usableW);
                        y += 3;
                        hr();
                    }

                    if (flightDeparture) {
                        ensure(15);
                        boldText(`귀국 항공편: ${flightDeparture.flightNo}`, marginL, 11, COLOR_PRIMARY);
                        y += 5;
                        normalText(`${flightDeparture.dep.name || flightDeparture.dep.iata || '?'} → ${flightDeparture.arr.name || flightDeparture.arr.iata || '?'}  |  ${flightDeparture.dep.time || ''} ~ ${flightDeparture.arr.time || ''}`, marginL, 9.5, COLOR_TEXT);
                        y += 5;
                        hr();
                    }

                    if (dayExpenses.length > 0) {
                        const sum = dayExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
                        ensure(12 + dayExpenses.length * 4);
                        boldText(`이 날의 경비`, marginL, 10.5, COLOR_ACCENT);
                        y += 5;
                        dayExpenses.forEach(e => {
                            normalText(`• ${e.desc}`, marginL, 8.5, COLOR_TEXT);
                            normalText(formatMoney(e.amount), pageW - marginR - 30, 8.5, COLOR_TEXT);
                            y += 4.5;
                        });
                        boldText(`합계: ${formatMoney(sum)}`, pageW - marginR - 35, 9.5, COLOR_PRIMARY);
                        y += 6;
                    }
                });

                const totalPages = pdf.getNumberOfPages();
                for (let p = 1; p <= totalPages; p++) {
                    pdf.setPage(p);
                    pdf.setFontSize(8);
                    pdf.setTextColor(COLOR_SUB[0], COLOR_SUB[1], COLOR_SUB[2]);
                    pdf.text(`Triptic 일정표  ·  ${p} / ${totalPages}`, pageW / 2, pageH - 8, { align: 'center' });
                }

                const filename = exportMode === 'all'
                    ? `여행일정표_${tripCity || '여행'}_전체.pdf`
                    : `여행일정표_${currentDay}일차.pdf`;

                pdf.save(filename);
                showToast('🎉 PDF가 성공적으로 다운로드되었습니다!');
            } catch (err) {
                console.error(err);
                showToast('PDF 생성 중 오류가 발생했습니다.', { type: 'error' });
            }
        }
    </script>
</body>
</html>
