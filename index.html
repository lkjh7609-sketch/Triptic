<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triptic - 감성 여행 플래너</title>
    
    <!-- 📱 PWA 매니페스트 & 테마 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F9F9F7">
    <meta name="description" content="차분하고 직관적인 여행 일정 플래너, Triptic">
    
    <!-- 🍎 iOS Safari 지원 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Triptic">
    <link rel="apple-touch-icon" href="icon-180.png">
    
    <!-- 🔤 프리텐다드 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    
    <!-- 📦 외부 라이브러리 (버전 고정) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

    <style>
        /* ==========================================================================
           🎨 차분하고 편안한 웜 베이지 디자인 시스템 (Warm Minimalist Beige)
           - 킨포크 / 노션 감성의 따뜻한 오트밀 & 린넨 뉴트럴 팔레트
           - 인위적인 형광색 및 어색한 좌측 보더("손톱 때") 전면 배제
           - 모바일과 PC 환경에 각각 완벽히 대응하는 유연한 반응형 아키텍처
           ========================================================================== */
        :root {
            /* 🌊 3번 방향: Nordic Travel (포근한 웜 화이트 + 쨍하고 선명한 딥 오션 네이비) */
            --bg-page: #F9F9F7;          /* 맑고 편안한 웜 오프화이트/노르딕 린넨 */
            --bg-surface: #F3F4F1;       /* 사이드바 / 서브 서피스 */
            --bg-card: #FFFFFF;          /* 순백 카드 */
            --bg-input: #FFFFFF;         /* 인풋 배경 */
            --bg-subtle: #E9ECE8;        /* 미세한 칩/태그 배경 */
            --bg-hover: #DEE3DC;         /* 호버 배경 */
            
            /* 고대비 딥 네이비 & 차콜 잉크 (가독성 100% 확보) */
            --text-title: #0F172A;       /* 딥 미드나잇 네이비 (선명한 헤드라인) */
            --text-body: #1E293B;        /* 딥 슬레이트 (선명한 본문) */
            --text-muted: #475569;       /* 또렷한 보조 설명 */
            --text-light: #94A3B8;       /* 은은한 플레이스홀더 */
            
            --border-color: #E2E8F0;     /* 깔끔한 슬레이트 보더 */
            --border-subtle: #EDF2F7;    /* 미세 보더 */
            --border-focus: #1E3A5F;     /* 포커스 딥 네이비 */
            
            /* 딥 오션 마린 네이비 액센트 */
            --brand-primary: #1E3A5F;    /* 메인 딥 오션 네이비 */
            --brand-hover: #142842;      /* 딥 네이비 호버 */
            --brand-light: #EDF3F8;      /* 노르딕 아이스 블루 틴트 */
            
            --accent-slate: #2563EB;     /* 대중교통 경로 (시원하고 명확한 블루) */
            --accent-slate-light: #EFF6FF;
            
            --success: #166534;          /* 딥 포레스트 그린 */
            --success-light: #DCFCE7;
            
            --warning: #9A3412;          /* 테라코타 앰버 */
            --warning-light: #FFEDD5;
            
            --danger: #991B1B;           /* 딥 브릭 레드 */
            --danger-light: #FEE2E2;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-pill: 9999px;
            
            --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
            --shadow-hover: 0 4px 14px rgba(15, 23, 42, 0.08);
            --shadow-modal: 0 20px 38px -4px rgba(15, 23, 42, 0.18), 0 6px 14px -2px rgba(15, 23, 42, 0.08);
            
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all;
            letter-spacing: -0.2px;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            background: var(--bg-page);
            color: var(--text-body);
            overflow: hidden;
        }

        /* ⚡ 스플래시 화면 */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--bg-page);
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #splash-screen .splash-logo {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            object-fit: cover;
        }
        #splash-screen .splash-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.5px;
        }
        #splash-screen .splash-credit {
            position: absolute;
            bottom: 24px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ==========================================================================
           🏠 로비(메인) 화면 - PC 대시보드 & 모바일 카드 피드
           ========================================================================== */
        #lobby-screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-page);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px 16px 40px;
            overflow-y: auto;
        }
        .lobby-container {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
        }
        .lobby-header {
            margin: 16px 0 24px;
        }
        .lobby-header-text h1 {
            color: var(--text-title);
            margin: 0 0 6px 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.6px;
        }
        .lobby-header-text p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .new-project-btn {
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 48px;
            width: 100%;
            transition: background var(--transition-fast), transform var(--transition-fast);
        }
        .new-project-btn:hover {
            background: var(--brand-hover);
        }
        .new-project-btn:active {
            transform: scale(0.98);
        }

        /* ☁️ 백업 & 기기 연동 카드 */
        .sync-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-card);
        }
        .sync-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .sync-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sync-code-badge {
            background: var(--bg-subtle);
            color: var(--brand-primary);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid var(--border-color);
        }
        .sync-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .sync-btn {
            flex: 1;
            min-width: 85px;
            min-height: 34px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-body);
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: background var(--transition-fast);
        }
        .sync-btn:hover {
            background: var(--bg-hover);
        }

        /* 🗂️ 여행 카드 리스트 (PC 그리드 & 모바일 스택) */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }
        .project-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
        }
        .project-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--brand-primary);
            transform: translateY(-1px);
        }
        .project-info h3 {
            margin: 0 0 6px 0;
            font-size: 17px;
            color: var(--text-title);
            font-weight: 700;
        }
        .project-meta {
            margin: 0 0 4px 0;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .project-badge {
            background: var(--brand-light);
            color: var(--brand-primary);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
        }
        .project-submeta {
            margin: 0;
            font-size: 12px;
            color: var(--text-light);
        }
        .project-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .clone-project-btn {
            background: var(--bg-subtle);
            color: var(--text-body);
            border: 1px solid var(--border-color);
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            min-height: 36px;
        }
        .clone-project-btn:hover {
            background: var(--bg-hover);
        }
        .delete-project-btn {
            background: var(--bg-subtle);
            color: var(--danger);
            border: 1px solid var(--border-color);
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            min-height: 36px;
        }
        .delete-project-btn:hover {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        /* ==========================================================================
           🗺️ 플래너(앱) 화면 - PC 2열 분할 & 모바일 최적화
           ========================================================================== */
        #app-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        #map {
            height: 38vh;
            width: 100%;
            flex-shrink: 0;
            z-index: 1;
            box-shadow: 0 2px 6px rgba(43, 37, 32, 0.04);
        }
        #sidebar {
            height: 62vh;
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-surface);
            z-index: 2;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        /* 🔝 상단 네비게이션 툴바 */
        .planner-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }
        .top-nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-title);
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 38px;
            box-shadow: var(--shadow-card);
            transition: background var(--transition-fast);
        }
        .top-nav-btn:hover {
            background: var(--bg-subtle);
        }
        .top-action-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-body);
            padding: 7px 11px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            box-shadow: var(--shadow-card);
            transition: background var(--transition-fast);
        }
        .icon-btn:hover {
            background: var(--bg-subtle);
        }
        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: var(--radius-pill);
        }

        /* 📍 여행 정보 바 & 수정 */
        .trip-info-bar {
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .trip-info-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 500;
        }
        .trip-info-text .city-name {
            color: var(--brand-primary);
            font-size: 16px;
            font-weight: 800;
        }
        .trip-edit-btn {
            background: var(--bg-subtle);
            color: var(--text-title);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-height: 34px;
            transition: background var(--transition-fast);
        }
        .trip-edit-btn:hover {
            background: var(--bg-hover);
        }

        /* 🔄 모드 세그먼트 컨트롤 */
        .mode-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: var(--bg-subtle);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition-fast);
            min-height: 36px;
        }
        .mode-btn.active {
            background: var(--bg-card);
            color: var(--brand-primary);
            box-shadow: var(--shadow-card);
        }

        #sidebar.view-mode .edit-only { display: none !important; }
        #sidebar.edit-mode .view-only { display: none !important; }

        /* 📅 일차별 탭 목록 */
        .day-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 6px;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .day-tab {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            border-radius: var(--radius-pill);
            font-weight: 700;
            color: var(--text-muted);
            font-size: 13px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition-fast);
        }
        .day-tab:hover {
            background: var(--bg-subtle);
        }
        .day-tab.active {
            background: var(--brand-primary);
            color: #ffffff;
            border-color: var(--brand-primary);
        }
        .day-tab-count {
            background: rgba(0, 0, 0, 0.07);
            padding: 2px 6px;
            border-radius: var(--radius-pill);
            font-size: 11px;
        }
        .day-tab.active .day-tab-count {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        /* 🔍 장소 검색 섹션 */
        .input-section {
            background: var(--bg-card);
            padding: 8px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
        }
        .input-group {
            display: flex;
            width: 100%;
        }
        .input-group input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
            outline: none;
            font-size: 14px;
            background: var(--bg-input);
            color: var(--text-title);
        }
        .input-group input[type="text"]:focus {
            border-color: var(--border-focus);
        }
        #add-btn {
            padding: 10px 18px;
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            min-height: 42px;
            transition: background var(--transition-fast);
        }
        #add-btn:hover {
            background: var(--brand-hover);
        }

        /* 🏨 숙소 / 식사 / 경비 액션 버튼 */
        .extra-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .extra-btn {
            flex: 1;
            padding: 9px 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-body);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 40px;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-fast);
        }
        .extra-btn:hover {
            background: var(--bg-subtle);
        }
        .extra-btn.has-data {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: var(--brand-light);
        }

        /* 📂 접이식 섹션 */
        .collapsible-section {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: none;
        }
        .collapsible-section.open { display: block; }
        .collapsible-title {
            padding: 12px 16px;
            font-weight: 800;
            font-size: 13px;
            color: var(--text-title);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-section-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .collapsible-content { padding: 14px 16px; }

        .hotel-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .hotel-row input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg-input);
            color: var(--text-title);
            outline: none;
        }
        .hotel-row input:focus { border-color: var(--border-focus); }
        .hotel-clear-btn {
            background: var(--bg-subtle);
            color: var(--danger);
            border: 1px solid var(--border-color);
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-height: 40px;
        }
        .hotel-clear-btn:hover {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        .meal-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .meal-row:last-child { margin-bottom: 0; }
        .meal-label {
            width: 50px;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-body);
            flex-shrink: 0;
        }
        .meal-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-title);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
        }
        .meal-input:focus { border-color: var(--border-focus); }
        .meal-skip-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            min-height: 40px;
            padding: 0 4px;
        }

        .expense-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .expense-desc {
            flex: 2;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-title);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
        }
        .expense-desc:focus { border-color: var(--border-focus); }
        .expense-amount {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-title);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
        }
        .expense-amount:focus { border-color: var(--border-focus); }
        .expense-add-btn {
            background: var(--brand-primary);
            color: #fff;
            border: none;
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            min-height: 40px;
        }
        .expense-add-btn:hover { background: var(--brand-hover); }
        .expense-list { margin-top: 10px; }
        .expense-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 14px;
        }
        .expense-list-item .exp-desc { color: var(--text-title); font-weight: 500; }
        .expense-list-item .exp-amount { color: var(--brand-primary); font-weight: 800; }
        .expense-del {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 13px;
            cursor: pointer;
            font-weight: 700;
            padding: 6px;
        }
        .expense-day-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            padding-top: 10px;
            margin-top: 6px;
            color: var(--text-title);
            font-size: 14px;
        }
        .expense-grand-total {
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            color: var(--brand-primary);
            font-size: 15px;
        }

        /* ==========================================================================
           📇 카드형 일정 리스트 (손톱 때 스타일 전면 제거, 정갈한 번호 뱃지 적용)
           ========================================================================== */
        #planner-list-container { min-height: 50px; }

        .place-item {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            /* 🚫 손톱 때 같은 두꺼운 border-left 제거 */
            position: relative;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
        }
        .place-item:hover {
            box-shadow: var(--shadow-hover);
            border-color: #D4CDBF;
        }
        .place-item.sortable-ghost {
            opacity: 0.4;
            border: 2px dashed var(--brand-primary);
        }

        /* 정갈한 장소 번호 뱃지 */
        .place-index-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--brand-light);
            color: var(--brand-primary);
            font-size: 11px;
            font-weight: 800;
            margin-right: 6px;
            flex-shrink: 0;
            vertical-align: middle;
        }

        .fixed-item {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-title);
            box-shadow: var(--shadow-card);
        }
        .fixed-item.flight-item {
            background: #F4EFEB;
            border-color: #DFD5CA;
        }
        .fixed-item .fi-label {
            font-weight: 800;
            color: var(--brand-primary);
            margin-right: 6px;
        }
        .fixed-item .fi-addr {
            color: var(--text-muted);
            font-size: 12px;
            display: block;
            margin-top: 3px;
        }

        .flight-preview {
            font-size: 13px;
            color: var(--success);
            margin-top: 6px;
            min-height: 16px;
            font-weight: 600;
        }
        .flight-lookup-btn {
            background: var(--bg-subtle);
            color: var(--brand-primary);
            border: 1px solid var(--border-color);
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-height: 40px;
        }
        .flight-lookup-btn:hover {
            background: var(--bg-hover);
        }

        .flight-manual-toggle {
            font-size: 12px;
            color: var(--brand-primary);
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 8px;
            padding: 4px 0;
            font-weight: 700;
            display: inline-block;
        }
        .flight-manual-fields {
            display: none;
            margin-top: 10px;
            padding: 14px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }
        .flight-manual-fields.open { display: block; }
        .flight-manual-fields .modal-field { margin-bottom: 10px; }
        .manual-flight-save-btn {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            margin-top: 4px;
        }

        /* 드래그 핸들 & 순서 버튼 */
        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-light);
            cursor: grab;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
        }
        .drag-handle:active {
            cursor: grabbing;
            color: var(--brand-primary);
            background: var(--bg-subtle);
        }

        .order-btns {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-right: 6px;
        }
        .order-btn {
            width: 32px;
            height: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-subtle);
            color: var(--text-body);
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .order-btn:disabled {
            opacity: 0.25;
            cursor: default;
        }
        .order-btn:not(:disabled):hover {
            background: var(--bg-hover);
        }

        .place-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .time-select {
            padding: 5px 6px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-weight: 700;
            color: var(--brand-primary);
            font-size: 13px;
            background: var(--bg-subtle);
            outline: none;
            text-align: center;
            min-height: 34px;
        }
        .time-text {
            font-weight: 800;
            color: var(--brand-primary);
            font-size: 14px;
        }

        .delete-btn {
            background: var(--bg-subtle);
            color: var(--danger);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            min-height: 34px;
        }
        .delete-btn:hover {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        .move-day-btn {
            background: var(--bg-subtle);
            color: var(--text-body);
            border: 1px solid var(--border-color);
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            min-height: 34px;
        }
        .move-day-btn:hover {
            background: var(--bg-hover);
        }

        .meal-tag {
            display: inline-block;
            background: var(--warning-light);
            color: var(--warning);
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            margin-right: 6px;
            vertical-align: middle;
        }

        .place-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-title);
            margin-bottom: 4px;
            display: block;
        }
        .place-address {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .memo-input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            font-size: 13px;
            background: var(--bg-page);
            color: var(--text-title);
            resize: none;
            outline: none;
            margin-top: 4px;
        }
        .memo-input:focus {
            border-color: var(--border-focus);
            background: #ffffff;
        }
        .memo-text {
            font-size: 13px;
            color: var(--text-body);
            background: var(--bg-page);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border-left: 2px solid var(--brand-primary);
            margin-top: 6px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        /* 🚇 대중교통 이동 딥링크 */
        .route-link-wrapper {
            display: flex;
            justify-content: center;
            margin: 4px 0 14px 0;
        }
        .route-link-btn {
            background: var(--bg-card);
            color: var(--accent-slate);
            border: 1px solid var(--border-color);
            padding: 7px 16px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-fast);
        }
        .route-link-btn:hover {
            border-color: var(--accent-slate);
            background: var(--accent-slate-light);
        }
        .transit-duration-tag {
            background: var(--accent-slate-light);
            color: var(--accent-slate);
            padding: 2px 6px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 800;
        }

        .pdf-actions {
            display: flex;
            gap: 8px;
            margin: 16px 0 40px;
        }
        .pdf-btn {
            flex: 1;
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            min-height: 44px;
            transition: background var(--transition-fast);
        }
        .pdf-btn:hover {
            background: var(--brand-hover);
        }

        .empty-day-notice {
            text-align: center;
            padding: 36px 16px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ==========================================================================
           🔔 토스트 및 모달
           ========================================================================== */
        #toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 32px);
            max-width: 440px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: #2B2520;
            color: #F7F5F0;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-modal);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: toastSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast.error { background: #7A2828; }
        .toast.success { background: #2D5A45; }
        .toast.fade-out { animation: toastFadeOut 0.25s forwards; }
        .toast-message { flex: 1; line-height: 1.4; }
        .toast-action-btn {
            background: var(--brand-light);
            color: var(--brand-primary);
            border: none;
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            min-height: 32px;
        }
        .toast-close-btn {
            background: none;
            border: none;
            color: #A59C92;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            min-height: 28px;
        }
        @keyframes toastSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastFadeOut {
            from { opacity: 1; transform: translateY(0); }
            to   { opacity: 0; transform: translateY(12px); }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(43, 37, 32, 0.45);
            backdrop-filter: blur(3px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-modal);
            border: 1px solid var(--border-color);
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalPop {
            0%   { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal-box h3 {
            margin: 0 0 16px;
            color: var(--text-title);
            font-size: 18px;
            font-weight: 800;
        }
        .modal-field { margin-bottom: 14px; }
        .modal-field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .modal-field input, .modal-field select, .modal-field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-title);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition-fast);
        }
        .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
            border-color: var(--border-focus);
        }
        .modal-field .date-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 11px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast);
        }
        .modal-btn.primary {
            background: var(--brand-primary);
            color: #ffffff;
        }
        .modal-btn.primary:hover {
            background: var(--brand-hover);
        }
        .modal-btn.secondary {
            background: var(--bg-subtle);
            color: var(--text-body);
            border: 1px solid var(--border-color);
        }
        .modal-btn.secondary:hover {
            background: var(--bg-hover);
        }
        .modal-btn.danger {
            background: var(--danger);
            color: #ffffff;
        }

        .pac-container {
            z-index: 10000 !important;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-modal);
            border: 1px solid var(--border-color);
            font-family: inherit;
        }

        /* ==========================================================================
           💻 데스크톱 / PC 대화면 레이아웃 최적화 (>= 900px)
           ========================================================================== */
        @media (min-width: 900px) {
            #lobby-screen {
                padding: 40px 32px 60px;
            }
            .lobby-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-bottom: 28px;
                padding-bottom: 20px;
                border-bottom: 1px solid var(--border-color);
            }
            .lobby-header-text h1 {
                font-size: 32px;
                margin: 0 0 6px 0;
            }
            .new-project-btn {
                margin-bottom: 0;
                width: auto;
                min-width: 180px;
            }
            .project-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 20px;
            }

            /* 플래너 PC 분할 화면 (왼쪽 지도 48%, 오른쪽 일정 패널 52%) */
            #app-screen {
                flex-direction: row;
                max-width: 100vw;
                height: 100vh;
            }
            #map {
                width: 48%;
                height: 100vh;
                box-shadow: 1px 0 10px rgba(43, 37, 32, 0.05);
            }
            #sidebar {
                width: 52%;
                height: 100vh;
                padding: 24px 32px;
                background: var(--bg-surface);
                border-left: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

    <!-- ⚡ 스플래시 화면 -->
    <div id="splash-screen">
        <img class="splash-logo" src="icon-192.png" alt="Triptic 로고">
        <div class="splash-title">Triptic</div>
        <div class="splash-credit">나만의 감성 여행 플래너</div>
    </div>

    <!-- 🔔 토스트 컨테이너 -->
    <div id="toast-container"></div>

    <!-- 🏠 로비(프로젝트 목록) 화면 -->
    <div id="lobby-screen">
        <div class="lobby-container">
            <div class="lobby-header">
                <div class="lobby-header-text">
                    <h1>Triptic</h1>
                    <p>차분하고 편안한 여행 일정 관리를 시작하세요</p>
                </div>
                <button type="button" class="new-project-btn" onclick="openCreateModal()">
                    <span>➕</span> 새 여행 만들기
                </button>
            </div>

            <!-- ☁️ 기기 동기화 및 백업 카드 -->
            <div class="sync-card">
                <div class="sync-card-header">
                    <span class="sync-card-title">☁️ 기기 동기화 & 백업</span>
                    <span class="sync-code-badge" id="my-backup-code" title="이 기기의 복구 코드">CODE</span>
                </div>
                <div class="sync-actions">
                    <button type="button" class="sync-btn" onclick="copyBackupCode()">📋 코드 복사</button>
                    <button type="button" class="sync-btn" onclick="openImportCloudModal()">🔄 다른 기기 연결</button>
                    <button type="button" class="sync-btn" onclick="pushBackupSync(true)">☁️ 지금 백업</button>
                    <button type="button" class="sync-btn" onclick="exportAllData()">📤 파일 저장</button>
                    <button type="button" class="sync-btn" onclick="document.getElementById('import-file-input').click()">📥 파일 불러오기</button>
                </div>
            </div>
            <input type="file" id="import-file-input" accept="application/json" style="display:none" onchange="importAllData(event)">

            <div id="project-list-container" class="project-list"></div>
        </div>
    </div>

    <!-- 🪟 모달 루트 -->
    <div id="modal-root"></div>

    <!-- 🗺️ 플래너 앱 화면 -->
    <div id="app-screen">
        <div id="map"></div>
        <div id="sidebar" class="edit-mode">
            <!-- 🔝 상단 네비게이션 바 -->
            <div class="planner-top-bar">
                <button type="button" class="top-nav-btn edit-only" onclick="showLobby()">
                    <span>←</span> 여행 목록
                </button>
                <div class="top-action-group">
                    <button type="button" class="icon-btn edit-only" id="share-action-btn" onclick="openShareModal()">
                        <span>🔗</span> 공유
                    </button>
                    <button type="button" class="icon-btn edit-only" id="suggestion-action-btn" onclick="openReviewSuggestionModal()">
                        <span>💡</span> 제안 <span id="suggestion-badge" class="badge-count" style="display:none">0</span>
                    </button>
                    <button type="button" class="icon-btn" onclick="copyItineraryText()" title="일정 텍스트 복사">
                        <span>📋</span> 복사

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')

        function showToast(message, options = {}) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${options.type || 'info'}`;
            
            const msgSpan = document.createElement('div');
            msgSpan.className = 'toast-message';
            msgSpan.innerHTML = message;
            toast.appendChild(msgSpan);

            if (options.actionText && typeof options.onAction === 'function') {
                const actionBtn = document.createElement('button');
                actionBtn.type = 'button';
                actionBtn.className = 'toast-action-btn';
                actionBtn.innerText = options.actionText;
                actionBtn.onclick = () => {
                    options.onAction();
                    toast.remove();
                };
                toast.appendChild(actionBtn);
            }

            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'toast-close-btn';
            closeBtn.setAttribute('aria-label', '닫기');
            closeBtn.innerText = '✕';
            closeBtn.onclick = () => toast.remove();
            toast.appendChild(closeBtn);

            container.appendChild(toast);

            const duration = options.duration || 3500;
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.classList.add('fade-out');
                    setTimeout(() => toast.remove(), 260);
                }
            }, duration);

        function formatMoney(amount, curr = tripCurrency) {
            const num = Number(amount) || 0;
            const meta = CURRENCIES[curr] || CURRENCIES.KRW;
            return `${num.toLocaleString()}${meta.unit}`;
        }

        function formatRelativeTime(timestamp) {
            if (!timestamp) return '방금 전';
            const diff = Date.now() - Number(timestamp);
            if (isNaN(diff) || diff < 0) return '방금 전';
            
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return '방금 전';
            if (mins < 60) return `${mins}분 전`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}시간 전`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}일 전`;
            
            const d = new Date(timestamp);
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        }

        function generateShortId(len = 7) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

        async function restoreFromCloudBackupIfNeeded() {
            if (!backupId || !FIREBASE_DB_URL) return;
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/devicebackups/${backupId}.json`);
                if (!res.ok) return;
                const cloudProjects = await res.json();
                if (!cloudProjects || typeof cloudProjects !== 'object' || Array.isArray(cloudProjects)) return;
                if (typeof cloudProjects.error === 'string') return;

                const cleanCloud = {};
                Object.keys(cloudProjects).forEach(k => {
                    const p = cloudProjects[k];
                    if (p && typeof p === 'object' && !Array.isArray(p)) cleanCloud[k] = p;
                });

                let updated = false;
                const localNames = Object.keys(allProjects);

                if (localNames.length === 0) {
                    allProjects = cleanCloud;
                    updated = true;
                } else {
                    Object.keys(cleanCloud).forEach(k => {
                        if (!allProjects[k]) {
                            allProjects[k] = cleanCloud[k];
                            updated = true;
                        } else {
                            const cloudTime = cleanCloud[k].updatedAt || 0;
                            const localTime = allProjects[k].updatedAt || 0;
                            if (cloudTime > localTime + 3000) {
                                allProjects[k] = cleanCloud[k];
                                updated = true;
                            }
                        }
                    });
                }

                if (updated) {
                    saveAllProjects(true);
                    renderLobby();
                }
            } catch (e) {}
        }

        function cloneProject(name) {
            const original = allProjects[name];
            if (!original) return;

            let newName = `${name} (복사본)`;
            let counter = 1;
            while (allProjects[newName]) {
                counter++;
                newName = `${name} (복사본 ${counter})`;
            }

            const clone = JSON.parse(JSON.stringify(original));
            clone.shareId = null;
            clone.updatedAt = Date.now();

            allProjects[newName] = clone;
            saveAllProjects();
            renderLobby();
            showToast(`'${escapeHtml(newName)}'으로 복제되었습니다!`);
        }

        function saveAllProjects(silent = false) {

                localStorage.setItem('smartPlannerAllProjects', JSON.stringify(allProjects));

                showToast('⚠️ 로컬 저장 공간이 가득 찼습니다. 오래된 여행을 파일로 내보낸 뒤 삭제해 주세요.', {

                    duration: 6000
                });

        function saveData() {
            if (!activeProjectName || !allProjects[activeProjectName]) return;

            if (plannerData[currentDay]) {
                plannerData[currentDay] = plannerData[currentDay].filter(item => item && item.lat != null && item.lng != null);
            }

            const p = allProjects[activeProjectName];

            p.hotels = hotelsData;
            p.meals = mealsData;
            p.expenses = expensesData;
            p.flights = flightsData;
            p.currency = tripCurrency;
            p.currentDay = currentDay;
            p.city = tripCity;

            p.cityLng = tripCityLng;
            p.startDate = tripStart;
            p.endDate = tripEnd;
            p.shareId = activeShareId;
            p.updatedAt = Date.now();

            saveAllProjects();
            scheduleShareSync();
        }

        function exportAllData() {
            try {
                const str = JSON.stringify(allProjects, null, 2);
                const blob = new Blob([str], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const today = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `Triptic_백업_${today}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('백업 파일이 다운로드되었습니다.');
            } catch (e) {
                showToast('데이터 내보내기 중 오류가 발생했습니다.', { type: 'error' });
            }
        }

        function importAllData(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported || typeof imported !== 'object') throw new Error('Invalid format');

                    const count = Object.keys(imported).length;
                    allProjects = { ...allProjects, ...imported };
                    saveAllProjects();
                    renderLobby();
                    showToast(`🎉 ${count}개의 여행을 불러왔습니다!`);
                } catch (err) {
                    showToast('올바른 백업 JSON 파일이 아닙니다.', { type: 'error' });
                }
            };
            reader.readAsText(file);
        }

        function generateSchedule(isLoad = false) {
            if (!tripStart || !tripEnd) return;
            const startDate = new Date(tripStart);
            const endDate = new Date(tripEnd);
            if (startDate > endDate) return;

            const diffTime = Math.abs(endDate - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            totalTripDays = diffDays;

            if (isLoad) {
                Object.keys(plannerData).forEach(d => {
                    if (Number(d) > diffDays) delete plannerData[d];
                });
                Object.keys(hotelsData).forEach(d => {
                    if (Number(d) > diffDays) delete hotelsData[d];
                });
                Object.keys(mealsData).forEach(d => {
                    if (Number(d) > diffDays) delete mealsData[d];
                });
                Object.keys(expensesData).forEach(d => {
                    if (Number(d) > diffDays) delete expensesData[d];
                });
            } else {
                plannerData = {};
            }

            tripDates = {};
            const container = document.getElementById('day-tabs-container');
            container.innerHTML = '';

            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

            for (let i = 1; i <= diffDays; i++) {
                const activeDate = new Date(startDate);
                activeDate.setDate(startDate.getDate() + (i - 1));
                const month = activeDate.getMonth() + 1;
                const day = activeDate.getDate();
                const w = weekdays[activeDate.getDay()];
                tripDates[i] = activeDate;

                if (!plannerData[i]) plannerData[i] = [];
                const placeCount = plannerData[i].length;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `day-tab ${i === currentDay ? 'active' : ''}`;
                btn.id = `tab-day-${i}`;
                btn.innerHTML = `
                    <span>${i}일차</span>
                    <span style="font-size:11px; opacity:0.85;">(${month}/${day} ${w})</span>
                    <span class="day-tab-count">${placeCount}</span>
                `;
                btn.onclick = () => changeDay(i);
                container.appendChild(btn);
            }

            if (currentDay > diffDays) currentDay = diffDays;

            renderTripInfoBar();
            changeDay(currentDay);
        }

        function changeDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
            const selected = document.getElementById(`tab-day-${day}`);
            if (selected) {
                selected.classList.add('active');
                selected.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            closeAllSections();
            saveData();
            renderList();

            refreshExtraButtonStates();

        function renderList() {
            const container = document.getElementById('planner-list-container');
            const startContainer = document.getElementById('hotel-start-container');
            const endContainer = document.getElementById('hotel-end-container');
            const flightStartContainer = document.getElementById('flight-start-container');
            const flightEndContainer = document.getElementById('flight-end-container');

            container.innerHTML = '';
            startContainer.innerHTML = '';
            endContainer.innerHTML = '';
            flightStartContainer.innerHTML = '';
            flightEndContainer.innerHTML = '';

            if (!plannerData[currentDay]) plannerData[currentDay] = [];
            plannerData[currentDay] = plannerData[currentDay].filter(item => item && item.lat != null && item.lng != null);
            const currentList = plannerData[currentDay];

            const { startHotel, endHotel } = getDayHotels(currentDay);
            const isFirstDay = currentDay === 1;
            const isLastDay = currentDay === totalTripDays;

            const flightArrivalPoint = (isFirstDay && flightsData.outbound && flightsData.outbound.arr)
                ? { name: `${flightsData.outbound.flightNo} 도착`, address: flightsData.outbound.arr.name || '', lat: flightsData.outbound.arr.lat, lng: flightsData.outbound.arr.lng }
                : null;
            const flightDeparturePoint = (isLastDay && flightsData.return && flightsData.return.dep)
                ? { name: `${flightsData.return.flightNo} 출발`, address: flightsData.return.dep.name || '', lat: flightsData.return.dep.lat, lng: flightsData.return.dep.lng }
                : null;

            const sequence = [];
            if (flightArrivalPoint) sequence.push(flightArrivalPoint);
            if (startHotel) sequence.push(startHotel);
            currentList.forEach(p => sequence.push(p));
            if (endHotel) sequence.push(endHotel);
            if (flightDeparturePoint) sequence.push(flightDeparturePoint);

            let seqPos = 0;
            function consumeNextLinkHTML() {
                const html = (seqPos + 1 < sequence.length) ? buildDeepLinkHTML(sequence[seqPos], sequence[seqPos + 1]) : '';
                seqPos++;
                return html;
            }

            if (flightArrivalPoint) {
                const f = flightsData.outbound;
                const airlineTag = f.airline ? ` (${escapeHtml(f.airline)})` : '';
                let html = `
                    <div class="fixed-item flight-item">
                        <div>
                            <span class="fi-label">✈️ ${escapeHtml(f.flightNo)}</span>
                            ${escapeHtml(f.dep.name || f.dep.iata || '?')} → ${escapeHtml(f.arr.name || f.arr.iata || '?')}${airlineTag}
                            <span class="fi-addr">${escapeHtml(f.dep.time || '')} 출발 → ${escapeHtml(f.arr.time || '')} 도착</span>
                        </div>
                    </div>
                `;
                html += consumeNextLinkHTML();
                flightStartContainer.innerHTML = html;
            }

            if (startHotel) {
                let html = `
                    <div class="fixed-item">
                        <div>
                            <span class="fi-label">🏨 출발</span>${escapeHtml(startHotel.name)}
                            <span class="fi-addr">${escapeHtml(startHotel.address || '')}</span>
                        </div>
                    </div>
                `;
                html += consumeNextLinkHTML();
                startContainer.innerHTML = html;
            }

            if (currentList.length === 0 && !startHotel && !endHotel && !flightArrivalPoint && !flightDeparturePoint) {

                    <div class="place-header">
                        <div class="header-left">
                            <span class="place-index-badge">${index + 1}</span>
                            <div class="drag-handle edit-only" title="길게 눌러 드래그">⠿</div>

                                <button type="button" class="order-btn" onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled' : ''} aria-label="위로">▲</button>
                                <button type="button" class="order-btn" onclick="moveItem(${index}, 1)" ${index === currentList.length - 1 ? 'disabled' : ''} aria-label="아래로">▼</button>
                            </div>
                            <div class="time-wrapper edit-only">
                                <select class="time-select" onchange="updateTime(${index}, this.value, 'hour')">${generateHourOptions(timeParts[0])}</select> :
                                <select class="time-select" onchange="updateTime(${index}, this.value, 'minute')">${generateMinuteOptions(timeParts[1])}</select>

                        <div class="action-group edit-only">
                            <button type="button" class="move-day-btn" onclick="openMoveDayModal(${index})" title="다른 날로 이동">📅 이동</button>

                            <span class="place-address">${escapeHtml(item.address || '')}</span>

                container.appendChild(card);
                container.insertAdjacentHTML('beforeend', consumeNextLinkHTML());

            if (endHotel) {
                let html = `
                    <div class="fixed-item">
                        <div>

                            <span class="fi-addr">${escapeHtml(endHotel.address || '')}</span>
                        </div>
                    </div>
                `;
                html += consumeNextLinkHTML();
                endContainer.innerHTML = html;

            if (flightDeparturePoint) {
                const f = flightsData.return;
                const airlineTag = f.airline ? ` (${escapeHtml(f.airline)})` : '';
                flightEndContainer.innerHTML = `
                    <div class="fixed-item flight-item">
                        <div>
                            <span class="fi-label">✈️ ${escapeHtml(f.flightNo)}</span>
                            ${escapeHtml(f.dep.name || f.dep.iata || '?')} → ${escapeHtml(f.arr.name || f.arr.iata || '?')}${airlineTag}
                            <span class="fi-addr">${escapeHtml(f.dep.time || '')} 출발 → ${escapeHtml(f.arr.time || '')} 도착</span>
                        </div>
                    </div>
                `;
            }

            const curTab = document.getElementById(`tab-day-${currentDay}`);
            if (curTab) {
                const cntBadge = curTab.querySelector('.day-tab-count');
                if (cntBadge) cntBadge.innerText = currentList.length;

        function buildDeepLinkHTML(a, b) {
            if (!a || !b || a.lat == null || a.lng == null || b.lat == null || b.lng == null) return '';
            const url = `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=transit`;
            const cacheKey = `${a.lat.toFixed(5)},${a.lng.toFixed(5)}->${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
            const cached = directionsCache.get(cacheKey);

            let durationTag = '';
            if (cached && cached.duration) {
                durationTag = `<span class="transit-duration-tag">🚇 약 ${escapeHtml(cached.duration)}</span>`;
            }

            return `
                <div class="route-link-wrapper view-only">
                    <a href="${url}" target="_blank" rel="noopener" class="route-link-btn">
                        ${durationTag}
                        <span>대중교통 길찾기 ↗</span>
                    </a>
                </div>
            `;
        }

        function addPlace() {
            let place = null;
            if (autocomplete) {
                try {
                    place = autocomplete.getPlace();
                } catch (e) {}
            }

            const input = document.getElementById('search-input');
            const typedName = input ? input.value.trim() : '';

            let placeName = '';
            let placeAddress = '';
            let lat = null;
            let lng = null;
            let placeId = null;

            if (place && place.geometry && place.geometry.location) {
                placeName = place.name || place.formatted_address;
                placeAddress = place.formatted_address || '';
                lat = place.geometry.location.lat();
                lng = place.geometry.location.lng();
                placeId = place.place_id || null;
            } else if (typedName) {
                placeName = typedName;
                placeAddress = tripCity ? `${tripCity} 일대` : '직접 입력 장소';
                lat = (tripCityLat || 35.6762) + (Math.random() - 0.5) * 0.01;
                lng = (tripCityLng || 139.6503) + (Math.random() - 0.5) * 0.01;
            } else {
                showToast('장소 이름을 입력하거나 검색 목록에서 선택해 주세요.', { type: 'error' });
                return;
            }

            if (!plannerData[currentDay]) plannerData[currentDay] = [];
            const validList = plannerData[currentDay].filter(Boolean);
            let defaultTime = '10:00';
            if (validList.length > 0) {
                defaultTime = validList[validList.length - 1].time || '10:00';
            }

            plannerData[currentDay].push({
                name: placeName,
                address: placeAddress,
                lat: lat,
                lng: lng,
                placeId: placeId,
                time: defaultTime,
                memo: ''
            });

            saveData();
            renderList();
            updateMarkers();

            if (input) {
                input.value = '';
                input.blur();
            }
            showToast(`'${escapeHtml(placeName)}' 장소가 추가되었습니다.`);
        }

        function deletePlace(index) {
            const list = plannerData[currentDay];
            const item = list[index];
            if (!item) return;

            lastDeletedPlace = {
                day: currentDay,
                index: index,
                item: JSON.parse(JSON.stringify(item)),
                mealType: item.mealType || null
            };

            if (item.mealType && mealsData[currentDay]) {
                mealsData[currentDay][item.mealType] = { skip: false };
            }

            list.splice(index, 1);
            saveData();
            renderList();
            updateMarkers();
            refreshExtraButtonStates();

            showToast(`'${escapeHtml(item.name)}' 장소가 삭제되었습니다.`, {
                actionText: '되돌리기',
                duration: 6000,
                onAction: () => {
                    if (!lastDeletedPlace) return;
                    const { day, index: restIdx, item: restItem } = lastDeletedPlace;
                    if (!plannerData[day]) plannerData[day] = [];
                    plannerData[day].splice(Math.min(restIdx, plannerData[day].length), 0, restItem);

                    if (restItem.mealType) {
                        if (!mealsData[day]) mealsData[day] = {};
                        mealsData[day][restItem.mealType] = { ...restItem, skip: false };
                    }

                    lastDeletedPlace = null;
                    saveData();
                    if (currentDay === day) {
                        renderList();
                        updateMarkers();
                        refreshExtraButtonStates();
                    } else {
                        changeDay(day);
                    }
                    showToast('장소가 복원되었습니다.');
                }
            });
        }

        function openMoveDayModal(index) {
            const item = plannerData[currentDay][index];
            if (!item) return;

            let optionsHtml = '';
            for (let d = 1; d <= totalTripDays; d++) {
                if (d !== currentDay) {
                    optionsHtml += `<option value="${d}">${d}일차</option>`;
                }
            }

            if (!optionsHtml) {
                showToast('이동할 다른 일차가 없습니다.', { type: 'error' });
                return;
            }

            openModal(`
                <h3>📅 다른 날로 장소 이동</h3>
                <p style="font-size:13px; color:var(--text-body); margin-bottom:12px;">
                    <b>'${escapeHtml(item.name)}'</b> 장소를 어느 날짜로 옮기시겠습니까?
                </p>
                <div class="modal-field">
                    <label>이동할 일차</label>
                    <select id="move-target-day">${optionsHtml}</select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn secondary" onclick="closeModal()">취소</button>
                    <button type="button" class="modal-btn primary" onclick="submitMovePlace(${index})">이동하기</button>
                </div>
            `);
        }

        function submitMovePlace(index) {
            const select = document.getElementById('move-target-day');
            const targetDay = Number(select ? select.value : 0);
            if (!targetDay || targetDay === currentDay) return;

            const list = plannerData[currentDay];
            const [moved] = list.splice(index, 1);
            if (!plannerData[targetDay]) plannerData[targetDay] = [];
            plannerData[targetDay].push(moved);

            closeModal();
            saveData();
            renderList();
            updateMarkers();

            showToast(`'${escapeHtml(moved.name)}'이(가) ${targetDay}일차로 이동되었습니다.`, {
                actionText: '그 날로 가기',
                onAction: () => changeDay(targetDay)
            });
        }

        function moveItem(index, direction) {
            const list = plannerData[currentDay];
            const newIndex = index + direction;
            if (!list || newIndex < 0 || newIndex >= list.length) return;
            const temp = list[index];
            list[index] = list[newIndex];
            list[newIndex] = temp;
            saveData();
            renderList();
            updateMarkers();
        }

        function updateTime(index, val, type) {
            if (!plannerData[currentDay] || !plannerData[currentDay][index]) return;
            let parts = (plannerData[currentDay][index].time || '10:00').split(':');
            if (type === 'hour') parts[0] = val;
            else parts[1] = val;
            plannerData[currentDay][index].time = parts.join(':');
            saveData();
        }

        function updateMemo(index, val) {
            if (!plannerData[currentDay] || !plannerData[currentDay][index]) return;
            plannerData[currentDay][index].memo = val;
            saveData();
        }

        function generateHourOptions(selectedHour) {
            let html = '';
            for (let h = 0; h < 24; h++) {
                const hh = String(h).padStart(2, '0');
                html += `<option value="${hh}" ${hh === selectedHour ? 'selected' : ''}>${hh}시</option>`;
            }
            return html;
        }

        function generateMinuteOptions(selectedMinute) {
            let html = '';
            for (let m = 0; m < 60; m += 5) {
                const mm = String(m).padStart(2, '0');
                html += `<option value="${mm}" ${mm === selectedMinute ? 'selected' : ''}>${mm}분</option>`;
            }
            return html;
        }

        function initSortable() {
            const el = document.getElementById('planner-list-container');
            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = new Sortable(el, {
                handle: '.drag-handle',
                draggable: '.place-item',
                animation: 150,
                ghostClass: 'sortable-ghost',
                forceFallback: true,
                fallbackTolerance: 3,
                delay: 100,
                delayOnTouchOnly: true,
                touchStartThreshold: 5,
                onEnd: function (evt) {
                    const fromIndex = evt.oldIndex;
                    const toIndex = evt.newIndex;
                    if (fromIndex === undefined || toIndex === undefined || fromIndex === toIndex) {
                        renderList();
                        return;
                    }
                    const list = plannerData[currentDay];
                    const moved = list.splice(fromIndex, 1)[0];
                    list.splice(toIndex, 0, moved);
                    saveData();
                    renderList();
                    updateMarkers();
                }
            });
        }

        function closeAllSections() {
            ['hotel', 'meal', 'expense'].forEach(s => {
                const el = document.getElementById(s + '-section');
                if (el) el.classList.remove('open');
            });
        }

        function toggleSection(section) {
            const el = document.getElementById(section + '-section');
            if (!el) return;
            const isOpen = el.classList.contains('open');
            closeAllSections();
            if (!isOpen) {
                el.classList.add('open');
                if (section === 'hotel') renderHotelSection();
                if (section === 'meal') renderMealSection();
                if (section === 'expense') renderExpenseSection();
            }
        }

        function refreshExtraButtonStates() {
            const hotelBtn = document.getElementById('hotel-toggle-btn');
            const mealBtn = document.getElementById('meal-toggle-btn');
            const expenseBtn = document.getElementById('expense-toggle-btn');
            if (hotelBtn) hotelBtn.classList.toggle('has-data', !!(hotelsData[currentDay] && hotelsData[currentDay].name));
            
            const m = mealsData[currentDay] || {};
            const hasMeal = ['breakfast', 'lunch', 'dinner'].some(k => m[k] && m[k].name && !m[k].skip);
            if (mealBtn) mealBtn.classList.toggle('has-data', hasMeal);

            const hasExpense = (expensesData[currentDay] || []).length > 0;
            if (expenseBtn) expenseBtn.classList.toggle('has-data', hasExpense);
        }

        function getEffectiveHotel(day) {
            for (let d = day; d >= 1; d--) {
                if (hotelsData[d] && hotelsData[d].name) return hotelsData[d];
            }
            return null;
        }

        function getDayHotels(day) {
            const isLastDay = day >= totalTripDays;
            const endHotel = isLastDay ? null : getEffectiveHotel(day);
            const startHotel = day > 1 ? getEffectiveHotel(day - 1) : null;
            return { startHotel, endHotel };
        }

            const input = document.getElementById('hotel-input');
            input.value = (hotelsData[currentDay] && hotelsData[currentDay].name) || '';
            if (window.google && google.maps && google.maps.places) {
                hotelAutocomplete = new google.maps.places.Autocomplete(input);
                hotelAutocomplete.bindTo('bounds', map);
                hotelAutocomplete.addListener('place_changed', () => {
                    const place = hotelAutocomplete.getPlace();
                    if (!place || !place.geometry) return;
                    hotelsData[currentDay] = {
                        name: place.name,
                        address: place.formatted_address || '',
                        lat: place.geometry.location.lat(),
                        lng: place.geometry.location.lng()
                    };
                    saveData();
                    renderList();
                    updateMarkers();
                    refreshExtraButtonStates();
                    showToast(`🏨 숙소 [${place.name}]이 등록되었습니다.`);
                });
            }
        }

        function clearHotel() {
            delete hotelsData[currentDay];
            document.getElementById('hotel-input').value = '';
            saveData();
            renderList();
            updateMarkers();
            refreshExtraButtonStates();
            showToast('숙소 정보가 삭제되었습니다.');
        }

        function renderMealSection() {
            const content = document.getElementById('meal-section-content');
            const dayMeals = mealsData[currentDay] || {};
            content.innerHTML = Object.keys(MEAL_META).map(slot => {
                const meta = MEAL_META[slot];

                const skipped = !!info.skip;
                return `
                    <div class="meal-row">
                        <div class="meal-label">${meta.emoji} ${meta.label}</div>
                        <input type="text" class="meal-input" id="meal-input-${slot}" placeholder="${meta.label} 식당 검색" value="${escapeHtml(info.name || '')}" ${skipped ? 'disabled' : ''}>
                        <label class="meal-skip-label">
                            <input type="checkbox" id="meal-skip-${slot}" onchange="toggleMealSkip('${slot}', this.checked)" ${skipped ? 'checked' : ''}>
